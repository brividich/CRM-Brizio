<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="ar-allow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="ar-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1100" height="520" fill="#f8fafc"/>

  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">ACL v2 · pipeline del resolver</text>
  <text x="40" y="66" font-size="12" fill="#64748b">core/acl_v2.py::resolve_acl_access · ogni request HTTP passa da qui</text>

  <!-- Request -->
  <rect x="40" y="100" width="170" height="70" rx="10" fill="#1d4ed8"/>
  <text x="125" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">HTTP request</text>
  <text x="125" y="150" text-anchor="middle" font-size="11" fill="#dbeafe">path + legacy_user</text>

  <!-- Step 1 Superuser -->
  <rect x="260" y="100" width="180" height="70" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="350" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">1. Superuser?</text>
  <text x="350" y="143" text-anchor="middle" font-size="11" fill="#64748b">django is_superuser</text>
  <text x="350" y="158" text-anchor="middle" font-size="11" fill="#64748b">bypass immediato</text>

  <!-- Step 2 Legacy admin -->
  <rect x="480" y="100" width="180" height="70" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="570" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">2. Legacy admin?</text>
  <text x="570" y="143" text-anchor="middle" font-size="11" fill="#64748b">is_legacy_admin()</text>
  <text x="570" y="158" text-anchor="middle" font-size="11" fill="#64748b">bypass</text>

  <!-- Step 3 Legacy user present -->
  <rect x="700" y="100" width="180" height="70" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="790" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">3. legacy_user?</text>
  <text x="790" y="143" text-anchor="middle" font-size="11" fill="#64748b">presente + ruolo_id</text>
  <text x="790" y="158" text-anchor="middle" font-size="11" fill="#64748b">altrimenti deny</text>

  <!-- Arrows across top row -->
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <path d="M210 135 L260 135" marker-end="url(#ar)"/>
    <path d="M440 135 L480 135" marker-end="url(#ar)"/>
    <path d="M660 135 L700 135" marker-end="url(#ar)"/>
  </g>

  <!-- ALLOW off top row (right green) -->
  <g>
    <rect x="920" y="100" width="140" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="990" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">✓ ALLOW</text>
    <text x="990" y="150" text-anchor="middle" font-size="11" fill="#166534">bypass admin</text>
  </g>
  <path d="M350 170 L350 205 Q350 220 365 220 L970 220 Q985 220 985 205 L985 170" stroke="#16a34a" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/>
  <path d="M570 170 L570 210 Q570 225 585 225 L980 225" stroke="#16a34a" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/>

  <!-- Arrow down to Step 4 -->
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <path d="M790 170 L790 215" marker-end="url(#ar)"/>
  </g>

  <!-- Step 4 Canonical binding -->
  <rect x="640" y="220" width="300" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="790" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">4. RoutePermissionBinding?</text>
  <text x="790" y="264" text-anchor="middle" font-size="11" fill="#1e3a8a">lookup su route_name → path_pattern</text>
  <text x="790" y="280" text-anchor="middle" font-size="11" fill="#1e3a8a">permission_code associato?</text>

  <!-- If yes → Role grant + User override -->
  <rect x="640" y="340" width="300" height="80" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="790" y="364" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">5. RolePermissionGrant</text>
  <text x="790" y="384" text-anchor="middle" font-size="11" fill="#1e3a8a">+ UserPermissionGrant (override)</text>
  <text x="790" y="400" text-anchor="middle" font-size="11" fill="#1e3a8a">decide allow/deny canonico</text>

  <g stroke="#475569" stroke-width="1.5" fill="none">
    <path d="M790 300 L790 340" marker-end="url(#ar)"/>
  </g>

  <!-- If no binding → fallback legacy -->
  <rect x="260" y="220" width="300" height="80" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="410" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">4b. Fallback legacy</text>
  <text x="410" y="264" text-anchor="middle" font-size="11" fill="#78350f">pulsanti + permessi storici</text>
  <text x="410" y="280" text-anchor="middle" font-size="11" fill="#78350f">ACL_LOG_LEGACY_FALLBACK warning</text>

  <g stroke="#475569" stroke-width="1.5" fill="none">
    <path d="M640 260 L560 260" marker-end="url(#ar)"/>
  </g>
  <text x="600" y="250" text-anchor="middle" font-size="10" font-style="italic" fill="#475569">no binding</text>

  <!-- Strict canonical branch -->
  <rect x="40" y="220" width="200" height="80" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="140" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">ACL_STRICT_CANONICAL</text>
  <text x="140" y="264" text-anchor="middle" font-size="11" fill="#7f1d1d">= 1 → forza DENY</text>
  <text x="140" y="280" text-anchor="middle" font-size="11" fill="#7f1d1d">anche se legacy allow</text>

  <g stroke="#dc2626" stroke-width="1.2" fill="none" stroke-dasharray="4 4">
    <path d="M260 260 L240 260" marker-end="url(#ar-deny)"/>
  </g>

  <!-- Final outcomes -->
  <rect x="260" y="340" width="200" height="80" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="360" y="364" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">decisione legacy</text>
  <text x="360" y="384" text-anchor="middle" font-size="11" fill="#78350f">allow/deny da pulsanti</text>
  <text x="360" y="400" text-anchor="middle" font-size="11" fill="#78350f">+ audit reason</text>

  <g stroke="#475569" stroke-width="1.5" fill="none">
    <path d="M410 300 L410 340" marker-end="url(#ar)"/>
  </g>

  <!-- Merge to allow/deny -->
  <rect x="540" y="440" width="140" height="55" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="610" y="464" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">✓ ALLOW</text>
  <text x="610" y="484" text-anchor="middle" font-size="11" fill="#166534">request continua</text>

  <rect x="380" y="440" width="140" height="55" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="450" y="464" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">✗ DENY</text>
  <text x="450" y="484" text-anchor="middle" font-size="11" fill="#991b1b">403 / redirect</text>

  <g stroke="#16a34a" stroke-width="1.5" fill="none">
    <path d="M790 420 L790 450 Q790 467 770 467 L680 467" marker-end="url(#ar-allow)"/>
    <path d="M360 420 L360 460 Q360 467 380 467" marker-end="url(#ar-allow)"/>
  </g>
  <g stroke="#dc2626" stroke-width="1.5" fill="none">
    <path d="M140 300 L140 467 Q140 467 380 467" marker-end="url(#ar-deny)"/>
  </g>
</svg>
