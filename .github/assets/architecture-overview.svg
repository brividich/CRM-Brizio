<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="frontBand" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="backBand" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="dataBand" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1100" height="560" fill="url(#bg)"/>

  <!-- Title -->
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">NOVICROM HUB · architettura di sistema</text>
  <text x="40" y="66" font-size="12" fill="#64748b">Django 5.2 · SSR · Waitress+IIS · SQL Server · Microsoft Graph · LDAP/AD</text>

  <!-- Frontend band -->
  <rect x="40" y="90" width="1020" height="88" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <rect x="40" y="90" width="160" height="88" rx="12" fill="url(#frontBand)"/>
  <text x="120" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">FRONTEND</text>
  <text x="120" y="146" text-anchor="middle" font-size="11" fill="#fff7ed">SSR + theme.css</text>

  <g font-size="12" fill="#0f172a">
    <rect x="220" y="105" width="155" height="58" rx="8" fill="#fff" stroke="#fed7aa"/>
    <text x="298" y="126" text-anchor="middle" font-weight="700">Django templates</text>
    <text x="298" y="145" text-anchor="middle" fill="#64748b">base.html · theme.css</text>

    <rect x="390" y="105" width="155" height="58" rx="8" fill="#fff" stroke="#fed7aa"/>
    <text x="468" y="126" text-anchor="middle" font-weight="700">Topbar / Sidebar</text>
    <text x="468" y="145" text-anchor="middle" fill="#64748b">NavigationRegistry</text>

    <rect x="560" y="105" width="155" height="58" rx="8" fill="#fff" stroke="#fed7aa"/>
    <text x="638" y="126" text-anchor="middle" font-weight="700">Global search</text>
    <text x="638" y="145" text-anchor="middle" fill="#64748b">Ctrl+K spotlight</text>

    <rect x="730" y="105" width="155" height="58" rx="8" fill="#fff" stroke="#fed7aa"/>
    <text x="808" y="126" text-anchor="middle" font-weight="700">UI preferences</text>
    <text x="808" y="145" text-anchor="middle" fill="#64748b">font_scale · sidebar</text>

    <rect x="900" y="105" width="145" height="58" rx="8" fill="#fff" stroke="#fed7aa"/>
    <text x="972" y="126" text-anchor="middle" font-weight="700">Onboarding</text>
    <text x="972" y="145" text-anchor="middle" fill="#64748b">wizard primo accesso</text>
  </g>

  <!-- Arrows to backend -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <path d="M120 178 L120 220" marker-end="url(#arrow)"/>
    <path d="M550 178 L550 220" marker-end="url(#arrow)"/>
    <path d="M970 178 L970 220" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Backend band -->
  <rect x="40" y="225" width="1020" height="165" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="40" y="225" width="160" height="165" rx="12" fill="url(#backBand)"/>
  <text x="120" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">BACKEND</text>
  <text x="120" y="308" text-anchor="middle" font-size="11" fill="#dbeafe">Django 5.2 · ORM</text>

  <g font-size="12" fill="#0f172a">
    <!-- Middleware -->
    <rect x="220" y="240" width="260" height="70" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text x="350" y="262" text-anchor="middle" font-weight="700">Middleware stack</text>
    <text x="350" y="281" text-anchor="middle" fill="#64748b">AdaptiveCookie · Impersonation</text>
    <text x="350" y="297" text-anchor="middle" fill="#64748b">ACLMiddleware (v2 resolver)</text>

    <!-- ACL -->
    <rect x="500" y="240" width="260" height="70" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text x="630" y="262" text-anchor="middle" font-weight="700">ACL canonico v2</text>
    <text x="630" y="281" text-anchor="middle" fill="#64748b">PermissionDefinition · Binding</text>
    <text x="630" y="297" text-anchor="middle" fill="#64748b">Role/User grant · fallback legacy</text>

    <!-- Apps -->
    <rect x="780" y="240" width="265" height="70" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text x="912" y="262" text-anchor="middle" font-weight="700">25+ app Django</text>
    <text x="912" y="281" text-anchor="middle" fill="#64748b">core, dashboard, assenze, tickets,</text>
    <text x="912" y="297" text-anchor="middle" fill="#64748b">assets, tasks, automazioni, …</text>

    <!-- Auth -->
    <rect x="220" y="320" width="260" height="60" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text x="350" y="342" text-anchor="middle" font-weight="700">Auth backends (cascata)</text>
    <text x="350" y="361" text-anchor="middle" fill="#64748b">Axes → SQLLegacy → LDAP → ModelBackend</text>

    <!-- Automazioni runtime -->
    <rect x="500" y="320" width="260" height="60" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text x="630" y="342" text-anchor="middle" font-weight="700">Automation runtime</text>
    <text x="630" y="361" text-anchor="middle" fill="#64748b">queue processor · approvazioni</text>

    <!-- Graph utils -->
    <rect x="780" y="320" width="265" height="60" rx="8" fill="#fff" stroke="#93c5fd"/>
    <text x="912" y="342" text-anchor="middle" font-weight="700">Graph / SharePoint</text>
    <text x="912" y="361" text-anchor="middle" fill="#64748b">token cache cross-process</text>
  </g>

  <!-- Arrows to data -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <path d="M350 390 L350 425" marker-end="url(#arrow)"/>
    <path d="M630 390 L630 425" marker-end="url(#arrow)"/>
    <path d="M912 390 L912 425" marker-end="url(#arrow)"/>
  </g>

  <!-- Data band -->
  <rect x="40" y="430" width="1020" height="95" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <rect x="40" y="430" width="160" height="95" rx="12" fill="url(#dataBand)"/>
  <text x="120" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">DATA &amp; INTEGRAZIONI</text>
  <text x="120" y="488" text-anchor="middle" font-size="11" fill="#dcfce7">SQL Server + esterni</text>

  <g font-size="12" fill="#0f172a">
    <rect x="220" y="445" width="195" height="65" rx="8" fill="#fff" stroke="#86efac"/>
    <text x="317" y="468" text-anchor="middle" font-weight="700">SQL Server</text>
    <text x="317" y="486" text-anchor="middle" fill="#64748b">mssql-django · pyodbc 18</text>
    <text x="317" y="502" text-anchor="middle" fill="#64748b">tabelle legacy + managed</text>

    <rect x="430" y="445" width="195" height="65" rx="8" fill="#fff" stroke="#86efac"/>
    <text x="527" y="468" text-anchor="middle" font-weight="700">Microsoft Graph</text>
    <text x="527" y="486" text-anchor="middle" fill="#64748b">SharePoint · Outlook</text>
    <text x="527" y="502" text-anchor="middle" fill="#64748b">Teams Flow · mailbox poll</text>

    <rect x="640" y="445" width="195" height="65" rx="8" fill="#fff" stroke="#86efac"/>
    <text x="737" y="468" text-anchor="middle" font-weight="700">Active Directory</text>
    <text x="737" y="486" text-anchor="middle" fill="#64748b">LDAPBackend + SSO</text>
    <text x="737" y="502" text-anchor="middle" fill="#64748b">SPNEGO · Kerberos</text>

    <rect x="850" y="445" width="195" height="65" rx="8" fill="#fff" stroke="#86efac"/>
    <text x="947" y="468" text-anchor="middle" font-weight="700">SMTP · webhook</text>
    <text x="947" y="486" text-anchor="middle" fill="#64748b">notifiche · Entra proxy</text>
    <text x="947" y="502" text-anchor="middle" fill="#64748b">pubblicazione approvazioni</text>
  </g>

  <!-- Legend -->
  <text x="40" y="552" font-size="11" fill="#64748b">Setup wizard · deploy IIS · process_automation_queue · periodic tasks · backup notturno</text>
</svg>
