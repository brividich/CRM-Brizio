      <text x="272" y="509" fill="#7f1d1d" font-size="11">segnalazioni sicurezza</text>
      <text x="272" y="523" fill="#7f1d1d" font-size="11">allegati · follow-up</text>

      <rect x="460" y="470" width="190" height="55" rx="8" fill="#fef2f2"/>
