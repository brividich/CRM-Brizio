      <text x="672" y="293" fill="#78350f" font-size="11">registro · immagini card</text>

      <rect x="860" y="240" width="180" height="55" rx="8" fill="#fef3c7"/>
      <text x="872" y="261" font-weight="700">📰 notizie</text>
      <text x="872" y="279" fill="#78350f" font-size="11">bacheca · audience</text>
      <text x="872" y="293" fill="#78350f" font-size="11">allegati · letture tracked</text>
