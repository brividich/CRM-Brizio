      <text x="562" y="394" fill="#1e3a8a" font-size="11">dipendenti · fornitori · documenti</text>
      <text x="562" y="408" fill="#1e3a8a" font-size="11">ruoli operativi · valutazioni</text>

      <rect x="795" y="355" width="245" height="55" rx="8" fill="#eff6ff"/>
