  <rect width="1100" height="720" fill="#f8fafc"/>

  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">Moduli del portale</text>
  <text x="40" y="66" font-size="12" fill="#64748b">25+ app Django organizzate per area funzionale · governance ACL canonica v2</text>

  <!-- Row 1: Core platform -->
  <g>
    <rect x="40" y="90" width="1020" height="100" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <rect x="40" y="90" width="6" height="100" fill="url(#g-core)"/>
    <text x="60" y="113" font-size="13" font-weight="700" fill="#334155">CORE PLATFORM</text>

    <g font-size="12" fill="#0f172a">
