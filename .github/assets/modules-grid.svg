      <text x="562" y="164" fill="#64748b" font-size="11">pannello admin custom · ACL canonico</text>
      <text x="562" y="178" fill="#64748b" font-size="11">diagnostica · route coverage · branding</text>

      <rect x="795" y="125" width="245" height="55" rx="8" fill="#f1f5f9"/>
      <text x="807" y="146" font-weight="700">🛠️ hub_tools · setup_wizard</text>
