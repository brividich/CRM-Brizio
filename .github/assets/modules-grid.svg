      <text x="72" y="164" fill="#64748b" font-size="11">home KPI personalizzabile · widget</text>
      <text x="72" y="178" fill="#64748b" font-size="11">layout per utente · template admin</text>

      <rect x="305" y="125" width="235" height="55" rx="8" fill="#f1f5f9"/>
      <text x="317" y="146" font-weight="700">⚙️ core</text>
      <text x="317" y="164" fill="#64748b" font-size="11">middleware · ACL · navigation</text>
      <text x="317" y="178" fill="#64748b" font-size="11">audit · onboarding · legacy models</text>

      <rect x="550" y="125" width="235" height="55" rx="8" fill="#f1f5f9"/>
