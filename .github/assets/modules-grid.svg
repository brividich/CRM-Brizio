      <text x="472" y="509" fill="#7f1d1d" font-size="11">unsafe conditions · SharePoint</text>
      <text x="472" y="523" fill="#7f1d1d" font-size="11">cache locale · Graph CRUD</text>

      <rect x="660" y="470" width="190" height="55" rx="8" fill="#fef2f2"/>
