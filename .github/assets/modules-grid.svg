      <text x="72" y="638" fill="#14532d" font-size="11">approvazioni email/Teams · Power Automate import</text>

      <rect x="380" y="585" width="310" height="55" rx="8" fill="#f0fdf4"/>
      <text x="392" y="606" font-weight="700">🔐 ACL canonico v2</text>
      <text x="392" y="624" fill="#14532d" font-size="11">PermissionDefinition · Route binding</text>
      <text x="392" y="638" fill="#14532d" font-size="11">grant ruolo · override utente · strict mode</text>

      <rect x="700" y="585" width="340" height="55" rx="8" fill="#f0fdf4"/>
      <text x="712" y="606" font-weight="700">🧪 setup_wizard · monitoring</text>
      <text x="712" y="624" fill="#14532d" font-size="11">installer PyInstaller 14 step · discovery SQL</text>
      <text x="712" y="638" fill="#14532d" font-size="11">server dashboard · log viewer · task scheduler</text>
    </g>
