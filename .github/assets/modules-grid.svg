      <text x="672" y="509" fill="#7f1d1d" font-size="11">MT/MTSI presa visione</text>
      <text x="672" y="523" fill="#7f1d1d" font-size="11">campagne · export CSV</text>

      <rect x="860" y="470" width="180" height="55" rx="8" fill="#fef2f2"/>
      <text x="872" y="491" font-weight="700">♻️ rentri</text>
      <text x="872" y="509" fill="#7f1d1d" font-size="11">tracciabilità rifiuti</text>
      <text x="872" y="523" fill="#7f1d1d" font-size="11">normativa RENTRI</text>
    </g>
  </g>

