    <rect x="666" y="585" width="60" height="20" rx="10" fill="#3B82F6"/>
    <text x="696" y="599" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">APERTO</text>

