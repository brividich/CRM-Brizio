<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-mh" x1="80" y1="60" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#E5EBF4"/>
    </linearGradient>
    <linearGradient id="hero-mh" x1="172" y1="190" x2="1108" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#2D5A8F"/>
    </linearGradient>
    <filter id="shadow-mh" x="118" y="78" width="1044" height="604" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1280" height="760" rx="28" fill="url(#bg-mh)"/>
  <circle cx="1120" cy="98" r="104" fill="#FFF4ED"/>
  <circle cx="184" cy="674" r="120" fill="#E0E7FF"/>
  <circle cx="1188" cy="676" r="72" fill="#DBEAFE"/>

  <g filter="url(#shadow-mh)">
    <rect x="140" y="100" width="1000" height="560" rx="28" fill="#EEF0F5"/>

    <!-- Browser chrome -->
    <rect x="140" y="100" width="1000" height="56" rx="28" fill="#1E3A5F"/>
    <rect x="140" y="128" width="1000" height="28" fill="#1E3A5F"/>
