    <text x="864" y="488" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">+ Crea OdL</text>
    <rect x="934" y="466" width="130" height="34" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="999" y="488" text-anchor="middle" fill="#1E3A5F" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Centro operativo</text>

    <rect x="778" y="540" width="310" height="100" rx="22" fill="#FFFFFF"/>
    <text x="802" y="568" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Prossimi 7 giorni</text>
    <text x="802" y="592" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="11">Lun 06/06 · Verifica CNC-003</text>
    <text x="802" y="610" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="11">Mer 08/06 · Cambio olio CNC-007</text>
