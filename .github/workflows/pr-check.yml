name: PR check

# Igiene repo (18/10/2026): controllo rapido su ogni PR verso main e release/prod.
# Lancia i test delle SOLE app toccate dal diff (tools/apps_dal_diff.ps1); la suite
# completa resta nel workflow notturno (nightly-tests.yml).
on:
  pull_request:
    branches: [main, release/prod]

jobs:
  pr-check:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: django_app/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r django_app/requirements.txt
          pip install ruff==0.16.7

      - name: Django check
        shell: pwsh
        run: python django_app/manage.py check --settings=config.settings.test

      - name: Migration drift check
        shell: pwsh
        run: python django_app/manage.py makemigrations --check --dry-run --settings=config.settings.test

      # Errori bloccanti (nomi non definiti, ridefinizioni, except nudi, import inutili)
      # su tutto django_app: dal 18/10 il debito su queste regole e' zero, va tenuto tale.
      # Regole complete in pyproject.toml (pre-commit).
      - name: Ruff
        shell: pwsh
        run: ruff check django_app --select F821,F811,E722,F401

      - name: Test delle app toccate
        shell: pwsh
        working-directory: django_app
        env:
          DEFAULT_FROM_EMAIL: noreply@example.com
        run: |
          $apps = (& ../tools/apps_dal_diff.ps1 -BaseRef "${{ github.event.pull_request.base.sha }}").Trim()
          if (-not $apps) { Write-Host "Nessuna app Django nel diff: test saltati."; exit 0 }
          Write-Host "App nel diff: $apps"
          python manage.py test @($apps -split ' ') --noinput --verbosity 1 --settings=config.settings.test
