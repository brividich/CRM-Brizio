<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Segnalazione inviata</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #1a2233; text-align: center; }
    h1 { font-size: 1.5rem; margin: .5rem 0; }
    .sc-check { width: 64px; height: 64px; border-radius: 50%; background: #e8f5ee; color: #1a8a4a; display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: .5rem; }
    .sc-actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; margin-top: 1.75rem; }
    .sc-btn { display: inline-block; padding: .6rem 1.2rem; border-radius: 8px; text-decoration: none; font-weight: 600; }
    .sc-btn-primary { background: #1a2233; color: #fff; }
    .sc-btn-secondary { background: #eef1f6; color: #1a2233; }
  </style>
</head>
<body>
  <div class="sc-check">&#10003;</div>
  <h1>Grazie!</h1>
  <p>La tua segnalazione è stata inviata al team SMS e verrà presa in carico.</p>

  <div class="sc-actions">
    <a class="sc-btn sc-btn-primary" href="{% url 'suggestion_corner:home' %}">Torna alla dashboard</a>
    <a class="sc-btn sc-btn-secondary" href="{% url 'suggestion_corner:nuova' %}">Invia un'altra segnalazione</a>
  </div>
</body>
</html>
