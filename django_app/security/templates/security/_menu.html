{% load soc_live security_help %}
<nav class="soc-nav soc-nav-main" aria-label="Navigazione SOC">
  <div class="soc-nav-group">
    {% for v in voci %}<a href="{{ v.url }}"{% if v.active %} class="active" aria-current="page"{% endif %}>{{ v.label }}</a>{% endfor %}
  </div>
  <div class="soc-nav-tools">
    <a href="{% soc_page_help_url url_name %}" class="soc-nav-help" title="Guida di questa pagina" aria-label="Guida di questa pagina">?</a>
    <form method="get" action="{% url 'security:search' %}" role="search" class="soc-nav-search">
      <input type="search" name="q" placeholder="Cerca PC, ticket, CVE…" aria-label="Cerca nel SOC" value="{% if url_name == 'search' %}{{ request.GET.q }}{% endif %}">
    </form>
  </div>
</nav>
{% if sezione and sezione.tabs|length > 1 %}
<nav class="soc-subnav" aria-label="{{ sezione.label }}">
  {% for t in sezione.tabs %}<a href="{{ t.url }}"{% if t.active %} class="active" aria-current="page"{% endif %}>{{ t.label }}</a>{% endfor %}
</nav>
{% endif %}
