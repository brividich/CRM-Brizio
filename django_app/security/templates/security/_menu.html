<nav class="soc-tabs" aria-label="Navigazione SOC">
  {% for v in voci %}
    <a class="soc-tab{% if v.active %} is-active{% endif %}" href="{{ v.url }}"{% if v.active %} aria-current="page"{% endif %}>
      <svg class="soc-ico" aria-hidden="true"><use href="#soc-i-{{ v.icon }}"/></svg>
      <span>{{ v.label }}</span>
      {% if v.badge %}<span class="soc-count tone-{{ v.badge.tone }}" title="{{ v.badge.title }}">{{ v.badge.value }}</span>{% endif %}
    </a>
  {% endfor %}
</nav>
{% if sezione and sezione.tabs|length > 1 %}
<nav class="soc-subnav" aria-label="{{ sezione.label }}">
  {% for t in sezione.tabs %}<a href="{{ t.url }}"{% if t.active %} class="active" aria-current="page"{% endif %}>{{ t.label }}</a>{% if t.sep_after %}<span class="soc-subnav-sep" aria-hidden="true"></span>{% endif %}{% endfor %}
</nav>
{% endif %}
