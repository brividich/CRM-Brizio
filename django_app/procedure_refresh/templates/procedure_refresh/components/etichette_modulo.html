{# Procedure CN-SGI applicate dal modulo: riga di etichette sopra il contenuto della pagina (core/base.html). #}
{% if procedure %}
<div class="cnsgi-tags" aria-label="Procedure del sistema di gestione"><span class="cnsgi-k">Procedure</span>
  {% for p in procedure %}<a class="cnsgi-tag" href="{% url 'procedure_refresh:libreria_documento' p.id %}" title="{{ p.codice }} · {{ p.titolo }}"><i>SGI</i>{{ p.codice }}{% if p.rev %} Rev.{{ p.rev }}{% endif %}</a>{% endfor %}
  {% if altre %}<a class="cnsgi-tag" href="{% url 'procedure_refresh:libreria' %}" title="Altre procedure di {{ modulo.nome }}">+{{ altre }}</a>{% endif %}
</div>
<style>
.cnsgi-tags{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin:0 0 8px}
.cnsgi-k{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-light)}
.cnsgi-tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:999px;padding:2px 9px 2px 3px;font-size:11.5px;font-weight:700;color:var(--text-mid);background:var(--surface);text-decoration:none;white-space:nowrap}
.cnsgi-tag:hover{border-color:var(--accent);color:var(--text)}
.cnsgi-tag i{font-style:normal;font-family:ui-monospace,Menlo,monospace;font-size:9.5px;background:var(--primary);color:#fff;border-radius:999px;padding:1px 6px}
</style>
{% endif %}
