{% extends "core/base.html" %}

{% block title %}Mansione checklist chiusura | Portale Applicativo{% endblock %}

{% block extra_head %}
<style>
.co-form { max-width:560px; background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:20px 24px; display:flex; flex-direction:column; gap:12px; }
.co-form label { font-size:12px; font-weight:700; color:#64748b; display:flex; flex-direction:column; gap:4px; }
.co-form .hub-input, .co-form .hub-select { padding:8px 10px; border:1px solid #cbd5e1; border-radius:8px; font-size:13px; }
.co-form .co-multi { min-height:120px; }
.co-form-help { font-size:11px; font-weight:500; color:#94a3b8; }
.co-form-error { background:#fee2e2; color:#b91c1c; font-size:12px; padding:8px 10px; border-radius:8px; }
.co-form-error-inline { color:#b91c1c; }
.co-form-actions { display:flex; gap:8px; align-items:center; }
.co-btn-confirm { padding:9px 18px; border-radius:8px; font-size:13px; font-weight:700; background:#16a34a; color:#fff; border:none; cursor:pointer; }
.co-btn-cancel { padding:9px 18px; border-radius:8px; font-size:13px; font-weight:700; background:#f1f5f9; color:#475569; border:1px solid #e2e8f0; cursor:pointer; }
body.theme-dark .co-form { background:#1e293b; border-color:#334155; }
</style>
<script>
/* Sulla pagina intera il pulsante "Annulla" del frammento torna alla configurazione:
   qui non c'è nessun popup da chiudere. */
function coModalClose() { window.location.href = "{% url 'checklist_operativa:configurazione' %}"; }
</script>
{% endblock %}

{% block content %}
{% include "checklist_operativa/partials/_task_form.html" %}
{% endblock %}
