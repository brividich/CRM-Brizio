{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controllo anomalie | NOVICROM HUB</title>
  <link rel="stylesheet" href="{% static 'core/vendor/outfit/outfit.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/theme.css' %}">
  <script src="{% static 'anomalie/js/react.development.js' %}"></script>
  <script src="{% static 'anomalie/js/react-dom.development.js' %}"></script>
  <script src="{% static 'anomalie/js/babel.min.js' %}"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { font-family: "Outfit", sans-serif; font-size: var(--fs-base); line-height: var(--lh-base); background: var(--bg); background: radial-gradient(circle at 16% 0%, color-mix(in srgb, var(--primary-mid) 11%, transparent), transparent 34%), radial-gradient(circle at 92% 7%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 28%), linear-gradient(180deg, var(--surface) 0%, var(--bg) 280px, var(--bg) 100%); }
    #root { position: relative; }
    /* Lo sfondo copre anche le pagine piu' alte della finestra (prima si interrompeva a 100vh). */
    /* Lo sfondo del body si propaga alla pagina ma si dimensiona sulla radice: se
       html resta alto quanto la finestra il gradiente si ripete e fa una banda. */
    html, body { height: auto; min-height: 100%; }
    .topbar { position: fixed; top: 0; left: 0; right: 0; height: 52px; background: var(--primary); display: flex; align-items: center; padding: 0 24px; gap: 16px; z-index: 100; box-shadow: 0 2px 16px rgba(0,0,0,.2); }
    .topbar-back { color: rgba(255,255,255,.80); text-decoration: none; font-size: var(--fs-base); font-weight: 600; white-space: nowrap; transition: color 0.15s; }
    .topbar-back:hover { color: #fff; }
    .topbar-sep { width: 1px; height: 22px; background: rgba(255,255,255,.25); flex-shrink: 0; }
    .topbar-title { flex: 1; font-size: var(--fs-md); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #fff; }
    .topbar-user { font-size: var(--fs-sm); font-weight: 600; color: rgba(255,255,255,.70); white-space: nowrap; }
    .content { padding-top: 72px; padding-bottom: 40px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .step-card { width: 100%; max-width: 820px; margin: 0 16px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; }
    .step-header { display: flex; align-items: center; gap: 14px; padding: 20px 28px 16px; border-bottom: 1px solid var(--border); }
    .step-num { width: 34px; height: 34px; background: var(--primary); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: var(--fs-lg); font-weight: 800; flex-shrink: 0; }
    .step-header h2 { font-size: var(--fs-title-md); font-weight: 700; color: var(--text); }
    .search-wrap { padding: 16px 28px 8px; }
    .search-input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: var(--fs-md); font-family: inherit; background: var(--bg); color: var(--text); outline: none; transition: border-color 0.15s, background 0.15s; }
    .search-input:focus { border-color: rgba(249,115,22,.5); background: var(--surface); box-shadow: 0 0 0 3px rgba(249,115,22,.12); }
    .create-op-wrap { padding: 16px 28px 4px; display: flex; flex-direction: column; gap: 10px; }
    .create-op-btn { align-self: flex-start; padding: 9px 14px; font-size: var(--fs-sm); }
    .create-op-hint { font-size: var(--fs-sm); color: var(--text-mid); }
    .create-op-panel { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .create-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .create-grid .full { grid-column: 1 / -1; }
    .create-op-checkbox { display: flex; align-items: center; gap: 7px; font-size: var(--fs-base); color: var(--text); user-select: none; }
    .create-op-checkbox input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
    .create-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    .op-list { max-height: 440px; overflow-y: auto; }
    .op-row { display: flex; flex-direction: column; gap: 4px; padding: 14px 28px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.12s; }
    .op-row:last-child { border-bottom: none; }
    .op-row:hover { background: var(--accent-light); }
    .op-row-title { font-size: var(--fs-md); font-weight: 700; color: var(--text); }
    .op-row-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: var(--fs-sm); color: var(--text-mid); }
    .op-row-meta span { display: flex; align-items: center; gap: 4px; }
    .meta-label { font-weight: 600; color: var(--text-light); }
    .badge { display: inline-flex; align-items: center; background: var(--success-bg); color: var(--success); border: 1px solid #c6f6d5; border-radius: 99px; padding: 1px 8px; font-size: var(--fs-xs); font-weight: 700; }
    .op-info-bar { background: var(--primary); padding: 12px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .op-info-back { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); color: #fff; border-radius: 6px; padding: 5px 12px; font-size: var(--fs-sm); font-weight: 700; cursor: pointer; white-space: nowrap; transition: background 0.15s; }
    .op-info-back:hover { background: rgba(255,255,255,.22); }
    .op-info-items { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex: 1; }
    .op-info-chip { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.20); border-radius: 6px; padding: 3px 10px; font-size: var(--fs-sm); color: rgba(255,255,255,.90); }
    .op-info-chip strong { color: #fff; font-weight: 700; }
    .form-body { padding: 20px 28px 24px; display: flex; flex-direction: column; gap: 20px; }
    .form-intro { display: grid; gap: 12px; padding: 16px 18px; border: 1px solid var(--border); border-radius: 12px; background: linear-gradient(135deg, var(--surface), var(--bg)); }
    .form-intro-title { color: var(--text); font-size: var(--fs-md); font-weight: 800; }
    .form-intro-copy { max-width: 62ch; color: var(--text-mid); font-size: var(--fs-sm); }
    .form-flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .form-flow-step { display: flex; align-items: center; gap: 8px; color: var(--text-mid); font-size: var(--fs-sm); font-weight: 600; }
    .form-flow-step b { display: grid; place-items: center; width: 24px; height: 24px; flex: 0 0 24px; border-radius: 50%; background: var(--accent-light); color: var(--accent); font-size: var(--fs-xs); }
    .field-hint { color: var(--text-mid); font-size: var(--fs-sm); line-height: 1.45; }
    .field-example { color: var(--text-light); font-size: var(--fs-xs); }
    .description-list { display: grid; gap: 12px; }
    .description-card { display: grid; gap: 10px; padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: 0 2px 8px rgba(15,23,42,.035); }
    .description-card__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .description-card__title { color: var(--text); font-weight: 800; }
    .description-card__meta { color: var(--text-light); font-size: var(--fs-xs); }
    .serial-choice { border: 1px solid var(--border); border-radius: 999px; padding: 7px 11px; background: var(--bg); transition: border-color .15s, background .15s; }
    .serial-choice:has(input:checked) { border-color: var(--accent); background: var(--accent-light); color: var(--text); }
    .description-add { align-self: flex-start; }
    body.theme-dark .form-intro { background: linear-gradient(135deg, var(--surface), var(--bg)); }
    body.theme-dark .serial-choice:has(input:checked) { background: rgba(249,115,22,.13); }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: var(--fs-base); font-weight: 700; color: var(--text); }
    .req { color: var(--danger); margin-left: 2px; }
    .checkbox-row { display: flex; gap: 10px 20px; flex-wrap: wrap; }
    .checkbox-item { display: flex; align-items: center; gap: 7px; font-size: var(--fs-base); color: var(--text); cursor: pointer; user-select: none; }
    .checkbox-item input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }
    /* theme.css da' a ogni input l'altezza dei controlli (40px): le caselle non ne hanno bisogno. */
    .checkbox-item input[type="checkbox"], .create-op-checkbox input[type="checkbox"] { min-height: 0; margin: 0; flex-shrink: 0; }
    .text-input, .textarea-input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: var(--fs-md); font-family: inherit; background: var(--bg); color: var(--text); outline: none; transition: border-color 0.15s, background 0.15s; }
    .text-input:focus, .textarea-input:focus { border-color: rgba(249,115,22,.5); background: var(--surface); box-shadow: 0 0 0 3px rgba(249,115,22,.12); }
    .text-input:disabled, .textarea-input:disabled { background: var(--bg-muted, #f1f5f9); color: var(--text-mid, #94a3b8); cursor: not-allowed; opacity: 0.7; }
    .textarea-input { resize: vertical; }
    .range-row { display: flex; align-items: center; gap: 10px; }
    .range-row .text-input { flex: 1; }
    .range-sep { font-size: var(--fs-xl); color: var(--text-light); font-weight: 700; flex-shrink: 0; }
    .sn-preview { margin-top: 8px; font-size: var(--fs-sm); color: var(--text-mid); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 7px 11px; }
    .sn-preview strong { color: var(--text); }
    .sn-warn { margin-top: 8px; font-size: var(--fs-sm); color: #92400e; background: #fffbeb; border: 1px solid #fcd34d; border-radius: 6px; padding: 7px 11px; font-weight: 600; }
    /* Popup d'aiuto: anomalia gia' aperta per il S/N digitato (con descrizione) */
    .sn-dup-pop { position: relative; margin-top: 10px; background: var(--surface); border: 1px solid #bfdbfe; border-left: 4px solid var(--primary-mid, #2563eb); border-radius: 8px; padding: 10px 12px; box-shadow: 0 6px 18px rgba(15,23,42,.10); display: flex; flex-direction: column; gap: 8px; animation: snDupIn .14s ease-out; }
    .sn-dup-pop::before { content: ""; position: absolute; top: -7px; left: 18px; width: 12px; height: 12px; background: var(--surface); border-left: 1px solid #bfdbfe; border-top: 1px solid #bfdbfe; transform: rotate(45deg); }
    @keyframes snDupIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .sn-dup-pop__head { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); font-weight: 700; color: var(--text); }
    .sn-dup-pop__icon { flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%; background: var(--primary-mid, #2563eb); color: #fff; font-weight: 800; font-size: 12px; line-height: 18px; text-align: center; }
    .sn-dup-card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
    .sn-dup-card__top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sn-dup-card__sn { font-weight: 700; color: var(--text); font-size: var(--fs-sm); letter-spacing: .02em; }
    .sn-dup-card__stato { font-size: var(--fs-xs, 11px); font-weight: 700; color: var(--primary-mid, #2563eb); background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 999px; padding: 1px 8px; }
    .sn-dup-card__desc { font-size: var(--fs-sm); color: var(--text-mid); white-space: pre-wrap; word-break: break-word; }
    .sn-dup-card__meta { font-size: var(--fs-xs, 11px); color: var(--text-mid); }
    .sn-dup-card__meta strong { color: var(--text); }
    .sn-dup-card__from { font-size: var(--fs-xs, 11px); color: var(--text-light); }
    .error-msg { background: var(--danger-bg); border: 1px solid #fca5a5; color: var(--danger); border-radius: 8px; padding: 10px 14px; font-size: var(--fs-base); font-weight: 600; }
    .info-msg { background: var(--bg); border: 1px solid var(--border); border-left: 4px solid var(--primary-mid); color: var(--text); border-radius: 8px; padding: 10px 14px; font-size: var(--fs-base); font-weight: 600; }
    .loading-msg, .empty-msg { padding: 32px 28px; text-align: center; font-size: var(--fs-md); color: var(--text-light); }
    .action-bar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; padding-top: 4px; }
    .btn-primary { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: var(--fs-base); font-weight: 700; cursor: pointer; white-space: nowrap; transition: filter .15s, transform .12s, box-shadow .15s; }
    .btn-primary:hover:not(:disabled) { filter: brightness(.96); box-shadow: 0 2px 10px rgba(249,115,22,.22); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: var(--surface); color: var(--text-mid); border: 1px solid var(--border); border-radius: 8px; padding: 10px 18px; font-size: var(--fs-base); font-weight: 700; cursor: pointer; white-space: nowrap; transition: background 0.15s, color 0.15s; }
    .btn-secondary:hover:not(:disabled) { background: var(--bg); color: var(--text); }
    .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
    /* Azioni "Salva e nuova": stessa famiglia del primario ma un gradino sotto. */
    .btn-outline { background: var(--surface); color: var(--accent); border: 1.5px solid var(--accent); border-radius: 8px; padding: 9px 18px; font-size: var(--fs-base); font-weight: 700; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
    .btn-outline:hover:not(:disabled) { background: var(--accent-light); }
    .btn-outline:disabled { opacity: 0.5; cursor: not-allowed; }
    /* Copilota AI */
    .copilot-box { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 12px; padding: 10px 12px; margin: 6px 0 14px; }
    .copilot-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .copilot-title { color: #0369a1; font-size: var(--fs-base); }
    .copilot-btn { background: #0284c7; color: #fff; border: none; border-radius: 8px; padding: 5px 11px; font-size: var(--fs-sm); font-weight: 700; cursor: pointer; font-family: inherit; }
    .copilot-btn:disabled { opacity: .6; cursor: default; }
    .copilot-hint { font-size: var(--fs-xs); color: #64748b; margin-top: 4px; }
    .copilot-err { font-size: var(--fs-sm); color: var(--danger); margin-top: 6px; }
    .copilot-sug { background: var(--surface); border: 1px solid #bae6fd; border-radius: 10px; padding: 8px 10px; margin-top: 8px; font-size: var(--fs-sm); color: var(--text); }
    .copilot-sug__row { margin-top: 4px; }
    .copilot-sug__why { color: var(--text-mid); }
    /* Tema scuro: superfici e avvisi che non derivano dai token */
    body.theme-dark .copilot-box { background: rgba(14,165,233,.08); border-color: rgba(56,189,248,.35); }
    body.theme-dark .copilot-title { color: #7dd3fc; }
    body.theme-dark .copilot-hint { color: var(--text-mid); }
    body.theme-dark .copilot-sug { border-color: rgba(56,189,248,.35); }
    body.theme-dark .step-num { background: var(--accent); }
    body.theme-dark .sn-warn { background: rgba(245,158,11,.12); color: #fcd34d; border-color: rgba(245,158,11,.45); }
    body.theme-dark .sn-dup-card__stato { background: rgba(59,130,246,.15); border-color: rgba(96,165,250,.4); color: #93c5fd; }
    body.theme-dark .sn-dup-pop, body.theme-dark .sn-dup-pop::before { border-color: rgba(96,165,250,.4); }
    body.theme-dark .error-msg { background: rgba(239,68,68,.12); border-color: rgba(248,113,113,.45); color: #fca5a5; }
    body.theme-dark .badge { border-color: rgba(56,161,105,.45); }
    body.theme-dark .text-input:disabled, body.theme-dark .textarea-input:disabled { background: rgba(255,255,255,.03); color: var(--text-light); border-style: dashed; opacity: 1; }
    .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); background: var(--success); color: #fff; padding: 12px 28px; border-radius: 10px; font-weight: 700; font-size: var(--fs-md); box-shadow: 0 4px 20px rgba(0,0,0,.20); z-index: 9999; white-space: nowrap; }
    /* ── Controllo a blocchi ── */
    .step-card--wide { max-width: 940px; }
    .op-info-chip.is-benestare { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 800; }
    .ctl-head { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; justify-content: space-between; padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 52px; z-index: 20; }
    .ctl-head__fase, .ctl-head__mail { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .ctl-head__val { font-size: var(--fs-md); font-weight: 800; color: var(--text); }
    .ctl-head__edit { display: inline-flex; gap: 6px; align-items: center; }
    .ctl-head__edit .text-input { width: 240px; padding: 6px 10px; }
    .seg-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 2px; background: var(--surface); }
    .seg-toggle button { border: 0; background: transparent; color: var(--text-mid); font: inherit; font-size: var(--fs-sm); font-weight: 700; padding: 5px 12px; border-radius: 999px; cursor: pointer; }
    .seg-toggle button.is-on { background: var(--primary); color: #fff; }
    .link-btn { background: none; border: 0; padding: 0; color: var(--primary-mid); font: inherit; font-size: var(--fs-sm); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
    .link-btn:disabled { opacity: .5; cursor: default; }
    .link-btn--danger { color: var(--danger); }
    .btn-sm { padding: 6px 12px; font-size: var(--fs-sm); }
    .resume-box { display: grid; gap: 8px; padding: 14px 16px; border: 1px solid var(--accent); border-radius: 12px; background: var(--accent-light); }
    .resume-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--border); }
    .mail-mode { border: 0; display: grid; gap: 8px; }
    .mail-mode__opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; background: var(--surface); }
    .mail-mode__opt.is-on { border-color: var(--accent); background: var(--accent-light); }
    .mail-mode__opt input { margin-top: 4px; accent-color: var(--accent); min-height: 0; }
    .mail-mode__opt > span { display: grid; gap: 2px; }
    .blk { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
    .blk.is-frozen { background: var(--bg); gap: 8px; }
    .blk.is-editing { border: 2px solid var(--accent); box-shadow: 0 6px 22px rgba(249,115,22,.10); }
    .blk-head { display: flex; align-items: center; gap: 12px; }
    .blk-head__main { flex: 1; min-width: 0; }
    .blk-num { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%; display: grid; place-items: center; background: var(--border); color: var(--text-mid); font-weight: 800; font-size: var(--fs-sm); }
    .blk-num.is-active { background: var(--accent); color: #fff; }
    .blk-title { font-weight: 800; color: var(--text); font-size: var(--fs-md); }
    .blk-sn { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-weight: 800; color: var(--text); word-break: break-word; }
    .blk-meta { font-size: var(--fs-sm); color: var(--text-mid); }
    .blk-lock { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); font-weight: 800; color: var(--success); background: var(--success-bg); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
    .blk-list { list-style: none; display: grid; gap: 4px; padding-left: 42px; }
    .blk-item__btn { width: 100%; display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font: inherit; color: var(--text); text-align: left; cursor: pointer; }
    .blk-item__n, .anom-card__n { flex: 0 0 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-light); color: var(--accent); font-size: var(--fs-xs); font-weight: 800; }
    .blk-item__txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: var(--fs-sm); }
    .blk-item__txt.is-open { white-space: pre-wrap; }
    .blk-item__att, .anom-card__att { font-size: var(--fs-xs); color: var(--text-mid); white-space: nowrap; }
    .blk-item__note { margin: 4px 0 2px 32px; font-size: var(--fs-sm); color: var(--text-mid); white-space: pre-wrap; }
    .blk-foot { display: flex; justify-content: flex-end; }
    .blk-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; padding-top: 6px; border-top: 1px solid var(--border); }
    .pill { display: inline-flex; align-items: center; font-size: var(--fs-xs); font-weight: 700; border-radius: 999px; padding: 2px 9px; white-space: nowrap; border: 1px solid transparent; }
    .pill-wait { background: #fff7ed; color: #c2410c; border-color: #fed7aa; }
    .pill-info { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .pill-ok { background: var(--success-bg); color: var(--success); }
    .sn-field { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 44px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); cursor: text; }
    .sn-field:focus-within { border-color: rgba(249,115,22,.5); background: var(--surface); box-shadow: 0 0 0 3px rgba(249,115,22,.12); }
    .sn-field.is-disabled { cursor: default; opacity: .85; }
