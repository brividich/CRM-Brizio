{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestione Anomalie</title>
  <link rel="stylesheet" href="{% static 'core/css/theme.css' %}">
  <script src="{% static 'anomalie/js/react.production.min.js' %}"></script>
  <script src="{% static 'anomalie/js/react-dom.production.min.js' %}"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      font-family: "Outfit", sans-serif;
      font-size: var(--fs-base);
      line-height: var(--lh-base);
      background: var(--bg);
      background:
        radial-gradient(circle at 16% 0%, color-mix(in srgb, var(--primary-mid) 11%, transparent), transparent 34%),
        radial-gradient(circle at 92% 7%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 28%),
        linear-gradient(180deg, var(--surface) 0%, var(--bg) 280px, var(--bg) 100%);
      color: #0f172a;
    }
    *::-webkit-scrollbar { width: 6px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    *::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    button:hover { opacity: 0.85; }
    input::placeholder, textarea::placeholder { color: #94a3b8; }
  </style>
</head>
<body class="fs-{{ ui_prefs.font_scale|default:'normal' }}{% if ui_prefs.theme_mode == 'dark' %} theme-dark{% endif %}">
  <div id="root"></div>

  <script>
    window.IS_ADMIN = {% if is_admin %}true{% else %}false{% endif %};
    window.ADMIN_URL = "{% if is_admin %}{% url 'anomalie_configurazione_page' %}?tab=riepilogo{% endif %}";
    window.ANOMALIE_CONFIG_LISTS = JSON.parse("{{ config_lists_json|escapejs }}");
    window.CURRENT_USER_NAME = "{{ current_user_name|escapejs }}";
    window.CURRENT_USER_EMAIL = "{{ current_user_email|escapejs }}";
    window.CURRENT_USER_NAME_NORMS = JSON.parse("{{ current_user_name_norms_json|escapejs }}");
    window.ANOMALIE_ACCESS = JSON.parse("{{ access_context_json|escapejs }}");
    window.ANOMALIE_API = {
      ordini: "{% url 'api_anomalie_ordini' %}",
      anomalie: "{% url 'api_anomalie_anomalie' %}",
      salva: "{% url 'api_anomalie_salva' %}",
      allegati_list: "{% url 'api_anomalie_allegati' %}",
      allegati_upload: "{% url 'api_anomalie_allegati_upload' %}",
      allegati_delete: "{% url 'api_anomalie_allegati_delete' %}",
      allegati_file: "{% url 'api_anomalie_allegati_file' %}",
      report: "{% url 'anomalie_report_segnalazione' %}",
      timeline: "{% url 'api_anomalie_timeline' %}",
    };
  </script>

  <script src="{% static 'anomalie/js/gestione_anomalie.bundle.js' %}"></script>
</body>
</html>
