{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestione anomalie | NOVICROM HUB</title>
  <link rel="stylesheet" href="{% static 'core/css/theme.css' %}">
  <script src="{% static 'anomalie/js/react.production.min.js' %}"></script>
  <script src="{% static 'anomalie/js/react-dom.production.min.js' %}"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      font-family: "Outfit", sans-serif;
      font-size: var(--fs-base);
      line-height: var(--lh-base);
      background: var(--bg);
      background:
        radial-gradient(circle at 16% 0%, color-mix(in srgb, var(--primary-mid) 11%, transparent), transparent 34%),
        radial-gradient(circle at 92% 7%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 28%),
        linear-gradient(180deg, var(--surface) 0%, var(--bg) 280px, var(--bg) 100%);
      color: var(--text);
    }
    *::-webkit-scrollbar { width: 6px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    *::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    input::placeholder, textarea::placeholder { color: #94a3b8; }
    /* ── Gestione anomalie (prefisso ga-) ── */
    .ga { min-height: 100vh; display: flex; flex-direction: column; color: var(--text); }
    .ga-top { position: sticky; top: 0; z-index: 100; height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 20px; background: var(--primary); box-shadow: 0 2px 12px rgba(0,0,0,.15); }
    .ga-top__left, .ga-top__right { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .ga-top__title { margin: 0; color: #fff; font-size: var(--fs-lg); font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ga-top__op { color: rgba(255,255,255,.75); background: rgba(255,255,255,.1); border-radius: 999px; padding: 3px 12px; font-size: var(--fs-sm); font-weight: 600; white-space: nowrap; }
    .ga-iconbtn { width: 34px; height: 34px; flex: 0 0 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: 9px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.08); color: #e2e8f0; cursor: pointer; text-decoration: none; }
    .ga-iconbtn:hover { background: rgba(255,255,255,.16); opacity: 1; }
    .ga-iconbtn:disabled { opacity: .35; cursor: default; }
    .ga-iconbtn--light { border-color: var(--border); background: var(--surface); color: var(--text-mid); width: 30px; height: 30px; flex-basis: 30px; }
    .ga-iconbtn--light:hover { background: var(--bg); }
    .ga-btn { display: inline-flex; align-items: center; gap: 7px; border-radius: 9px; padding: 8px 15px; font: inherit; font-size: var(--fs-base); font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; border: 1px solid transparent; transition: filter .15s, background .15s; }
    .ga-btn:disabled { opacity: .55; cursor: not-allowed; }
    .ga-btn:hover:not(:disabled) { opacity: 1; filter: brightness(.96); }
    .ga-btn--accent { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(249,115,22,.28); }
    .ga-btn--ghost { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.14); color: #e2e8f0; font-weight: 600; }
    .ga-btn--outline { background: var(--surface); border-color: var(--accent); color: var(--accent); }
    .ga-btn--ghost-dark { background: transparent; border-color: var(--border); color: var(--text-mid); }
    .ga-btn--sm { padding: 6px 12px; font-size: var(--fs-sm); margin-top: 12px; }
    .ga-menu { position: relative; }
    .ga-menu__scrim { position: fixed; inset: 0; z-index: 110; }
    .ga-menu__pop { position: absolute; right: 0; top: 42px; z-index: 120; min-width: 250px; display: grid; padding: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 14px 40px rgba(15,23,42,.18); }
    .ga-menu__pop > * { text-align: left; padding: 9px 12px; border-radius: 8px; border: 0; background: none; color: var(--text); font: inherit; font-size: var(--fs-base); cursor: pointer; text-decoration: none; }
    .ga-menu__pop > *:hover:not(:disabled) { background: var(--bg); opacity: 1; }
    .ga-menu__pop > *:disabled { color: var(--text-light); cursor: default; }

    .ga-cols { flex: 0 0 auto; display: grid; grid-template-rows: minmax(0, 1fr); height: calc(100vh - 56px); min-height: 0; overflow: hidden; }
    .ga-col { display: flex; flex-direction: column; min-height: 0; overflow: hidden; border-right: 1px solid var(--border); }
    .ga-col--op { background: var(--surface); }
    .ga-col--sn { background: var(--bg); }
    .ga-col--det { background: var(--surface); border-right: 0; }
    .ga-col__head { padding: 14px 14px 12px; border-bottom: 1px solid var(--border); display: grid; gap: 10px; }
    .ga-col__title { font-size: var(--fs-sm); font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--text); display: flex; align-items: baseline; gap: 8px; }
    .ga-col__sub { font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--text-mid); }
    .ga-col__body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
    .ga-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .ga-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-mid); border-radius: 999px; padding: 5px 10px; font: inherit; font-size: var(--fs-xs); font-weight: 700; cursor: pointer; }
    .ga-chip.is-on { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
    .ga-chip__n { min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--bg); color: var(--text-mid); text-align: center; }
    .ga-chip.is-on .ga-chip__n { background: var(--accent); color: #fff; }
    .ga-chip--warn .ga-chip__n { background: #fff7ed; color: #c2410c; }
    .ga-search { position: relative; display: flex; align-items: center; color: var(--text-light); }
    .ga-search svg { position: absolute; left: 10px; }
    .ga-search input { width: 100%; padding: 8px 12px 8px 32px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); color: var(--text); outline: none; font: inherit; min-height: 0; }
    .ga-search input:focus { border-color: rgba(249,115,22,.55); background: var(--surface); box-shadow: 0 0 0 3px rgba(249,115,22,.12); }
    .ga-empty { padding: 28px 16px; text-align: center; color: var(--text-light); display: grid; justify-items: center; }
    .ga-empty--big { margin: auto; font-size: var(--fs-md); }

    .ga-op { display: grid; gap: 4px; text-align: left; width: 100%; padding: 11px 12px; border-radius: 11px; border: 1px solid transparent; border-left: 3px solid transparent; background: transparent; color: var(--text); font: inherit; cursor: pointer; }
    .ga-op:hover { background: var(--bg); opacity: 1; }
    .ga-op.is-sel { background: var(--accent-light); border-color: rgba(249,115,22,.25); border-left-color: var(--accent); }
    .ga-op__row { display: flex; align-items: center; gap: 8px; }
    .ga-op__id { font-weight: 800; font-size: var(--fs-md); }
    .ga-op__todo { margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--accent); color: #fff; font-size: var(--fs-xs); font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
    .ga-op__pn { font-family: ui-monospace, Consolas, monospace; font-size: var(--fs-sm); color: var(--text-mid); }
    .ga-op__people { display: flex; align-items: center; gap: 5px; font-size: var(--fs-sm); color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ga-op__bar { position: relative; display: block; height: 18px; margin-top: 4px; border-radius: 999px; background: var(--bg); overflow: hidden; border: 1px solid var(--border); }
    .ga-op__bar-fill { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--success) 30%, transparent); }
    .ga-op__bar-txt { position: relative; display: block; text-align: center; font-size: 10.5px; line-height: 16px; font-weight: 700; color: var(--text-mid); }
    .ga-op__none { font-size: var(--fs-xs); color: var(--text-light); }

    .ga-blk { margin: 8px 4px 2px; padding: 7px 10px; border-left: 3px solid var(--accent); border-radius: 7px; background: var(--surface); box-shadow: 0 1px 3px rgba(15,23,42,.05); }
    .ga-blk:first-child { margin-top: 2px; }
    .ga-blk__sn { font-family: ui-monospace, Consolas, monospace; font-weight: 800; font-size: var(--fs-sm); color: var(--text); word-break: break-word; }
    .ga-blk__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-mid); }
    .ga-blk__todo { margin-left: auto; color: #c2410c; font-size: 11px; font-weight: 800; }
    .ga-an { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; padding: 9px 10px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--text); font: inherit; cursor: pointer; }
    .ga-an:hover { background: var(--surface); opacity: 1; }
    .ga-an.is-sel { background: var(--surface); border-color: var(--border); box-shadow: 0 2px 8px rgba(15,23,42,.07); outline: 2px solid rgba(249,115,22,.35); outline-offset: -1px; }
    .ga-an.is-closed { opacity: .72; }
    .ga-an__dot { width: 10px; height: 10px; flex: 0 0 10px; margin-top: 5px; border-radius: 50%; background: #94a3b8; }
    .ga-an__dot--attesa { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.2); }
    .ga-an__dot--aperto { background: #3b82f6; }
    .ga-an__dot--chiuso { background: var(--success); }
    .ga-an__main { min-width: 0; display: grid; gap: 4px; flex: 1; }
    .ga-an__txt { font-weight: 600; font-size: var(--fs-sm); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ga-an__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
    .ga-an__sub { flex-basis: 100%; font-size: var(--fs-xs); color: var(--text-mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ga-an__id { margin-left: auto; font-size: var(--fs-xs); color: var(--text-light); font-family: ui-monospace, Consolas, monospace; }
    .ga-closed { margin-top: 10px; }
    .ga-closed__toggle { width: 100%; text-align: left; padding: 8px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--text-mid); font: inherit; font-size: var(--fs-sm); font-weight: 700; cursor: pointer; margin-bottom: 4px; }
    .ga-closed__toggle span { display: inline-block; transition: transform .15s; }

    .ga-pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; border: 1px solid transparent; }
    .ga-pill--lg { font-size: var(--fs-xs); padding: 3px 11px; }
    .ga-pill--attesa { background: #fff7ed; color: #c2410c; border-color: #fed7aa; }
    .ga-pill--aperto { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .ga-pill--chiuso { background: var(--success-bg); color: var(--success); border-color: color-mix(in srgb, var(--success) 30%, transparent); }
    .ga-pill--rdc { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    .ga-pill--cli { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
    .ga-pill--ben { background: #dcfce7; color: #166534; border-color: #86efac; }
    .ga-pill--muted { background: var(--bg); color: var(--text-mid); border-color: var(--border); }
    .ga-pill--sup { background: #fff1e6; color: #9a3412; border-color: #fdba74; }

    .ga-det__head { padding: 16px 24px 14px; border-bottom: 1px solid var(--border); display: grid; gap: 8px; }
    .ga-det__crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--text-mid); }
    .ga-det__sep { color: var(--text-light); }
    .ga-mono { font-family: ui-monospace, Consolas, monospace; font-weight: 700; color: var(--text); }
    .ga-det__titlerow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .ga-det__title { margin: 0; font-size: var(--fs-title-md); font-weight: 800; color: var(--text); }
    .ga-det__nav { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--text-mid); }
    .ga-det__people { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: var(--fs-sm); color: var(--text-mid); }
    .ga-det__people b { color: var(--text-light); font-weight: 700; text-transform: uppercase; font-size: 10.5px; letter-spacing: .05em; margin-right: 4px; }
    .ga-det__body { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 24px 24px; display: grid; gap: 16px; align-content: start; }
    .ga-det__foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 12px 24px; border-top: 1px solid var(--border); background: var(--surface); box-shadow: 0 -6px 16px rgba(15,23,42,.05); }
    .ga-det__state { margin-right: auto; font-size: var(--fs-sm); color: var(--text-light); }
    .ga-det__state.is-dirty { color: #c2410c; font-weight: 700; }
    .ga-card { border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: grid; gap: 12px; background: var(--surface); }
    .ga-card--decision { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
    .ga-card--decision.is-dirty { box-shadow: 0 0 0 3px rgba(249,115,22,.12); }
    .ga-card__head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .ga-card__title { font-size: var(--fs-sm); font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--text); }
    .ga-card__sub { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); font-weight: 700; color: var(--text-mid); }
    .ga-link { margin-left: auto; background: none; border: 0; padding: 0; color: var(--primary-mid); font: inherit; font-size: var(--fs-sm); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
    .ga-hint .ga-link { margin-left: 0; }
    .ga-desc { white-space: pre-wrap; font-size: var(--fs-md); line-height: 1.5; color: var(--text); }
    .ga-input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); color: var(--text); font: inherit; outline: none; resize: vertical; }
    .ga-input:focus { border-color: rgba(249,115,22,.55); background: var(--surface); box-shadow: 0 0 0 3px rgba(249,115,22,.12); }
    .ga-input:disabled { opacity: .75; cursor: not-allowed; }
    .ga-hint { font-size: var(--fs-xs); color: var(--text-light); }
    .ga-multi { display: grid; gap: 8px; }
    .ga-multi__item { border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: grid; gap: 6px; }
    .ga-multi__title { font-weight: 700; font-size: var(--fs-sm); }
    .ga-att { border: 2px dashed var(--border); border-radius: 12px; padding: 10px 12px; display: grid; gap: 10px; outline: none; transition: border-color .15s, background .15s; }
    .ga-att:focus { border-color: rgba(249,115,22,.5); }
    .ga-att.is-over { border-color: var(--accent); background: var(--accent-light); }
    .ga-att__head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .ga-att__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
    .ga-att__item { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); display: grid; }
    .ga-att__thumb { display: grid; place-items: center; height: 86px; border: 0; padding: 0; background: var(--bg); cursor: zoom-in; color: var(--text-mid); font-weight: 800; text-decoration: none; }
    .ga-att__thumb--file { cursor: pointer; }
    .ga-att__thumb img { width: 100%; height: 86px; object-fit: cover; display: block; }
    .ga-att__name { padding: 5px 8px 0; font-size: var(--fs-xs); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ga-att__acts { display: flex; gap: 10px; padding: 3px 8px 7px; }
    .ga-att__acts a, .ga-att__acts button { background: none; border: 0; padding: 0; font: inherit; font-size: var(--fs-xs); font-weight: 700; color: var(--primary-mid); cursor: pointer; text-decoration: none; }
    .ga-att__acts .is-danger, .ga-att__acts button:last-child { color: var(--danger); }
    .ga-flags { display: flex; flex-wrap: wrap; gap: 8px; }
    .ga-flag { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg); color: var(--text-mid); font-size: var(--fs-sm); font-weight: 600; cursor: pointer; user-select: none; }
    .ga-flag input { position: absolute; opacity: 0; width: 0; height: 0; }
    .ga-flag__box { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--text-light); display: inline-flex; align-items: center; justify-content: center; color: #fff; }
    .ga-flag.is-on { border-color: var(--accent); background: var(--accent-light); color: var(--text); }
    .ga-flag.is-on .ga-flag__box { background: var(--accent); border-color: var(--accent); }
    .ga-flag.is-disabled { cursor: not-allowed; opacity: .7; }
    .ga-flag:focus-within { box-shadow: 0 0 0 3px rgba(249,115,22,.18); }
    .ga-grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .ga-note { padding: 9px 12px; border-radius: 9px; font-size: var(--fs-sm); font-weight: 600; }
    .ga-note--warn { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning); }
    .ga-note--ok { background: var(--success-bg); color: var(--success); border: 1px solid color-mix(in srgb, var(--success) 35%, transparent); }
    .ga-apply { display: flex; align-items: flex-start; gap: 9px; padding: 10px 12px; border: 1px dashed var(--accent); border-radius: 10px; background: var(--bg); font-size: var(--fs-sm); cursor: pointer; }
    .ga-apply input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; min-height: 0; }

    .ga-modal { position: fixed; inset: 0; z-index: 300; background: rgba(15,23,42,.45); display: grid; place-items: center; padding: 16px; }
    .ga-modal__box { width: min(460px, 100%); background: var(--surface); color: var(--text); border-radius: 16px; padding: 22px; box-shadow: 0 24px 60px rgba(0,0,0,.3); display: grid; gap: 10px; }
    .ga-modal__title { font-size: var(--fs-lg); font-weight: 800; }
    .ga-modal__acts { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .ga-lightbox { position: fixed; inset: 0; z-index: 300; background: rgba(2,6,23,.88); display: grid; place-items: center; padding: 24px 24px 80px; }
    .ga-lightbox img { max-width: 100%; max-height: calc(100vh - 120px); border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.5); background: #fff; }
    .ga-lightbox__bar { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-radius: 999px; background: rgba(15,23,42,.92); color: #e2e8f0; font-size: var(--fs-sm); max-width: calc(100vw - 32px); }
    .ga-lightbox__bar button, .ga-lightbox__bar a { background: none; border: 0; color: #fff; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; }
    .ga-lightbox__bar button:disabled { opacity: .35; }
    .ga-toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 400; background: var(--success); color: #fff; padding: 11px 20px; border-radius: 10px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.22); max-width: calc(100vw - 32px); animation: gaIn .18s ease-out; }
    .ga-toast.is-err { background: var(--danger); }
    @keyframes gaIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .ga-tabs { position: fixed; bottom: 0; left: 0; right: 0; height: 58px; z-index: 150; display: flex; background: var(--primary); border-top: 1px solid rgba(255,255,255,.12); }
    .ga-tabs button { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: 0; border-top: 2px solid transparent; color: rgba(255,255,255,.6); font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; }
    .ga-tabs button.is-on { color: #fff; border-top-color: var(--accent); }
    .ga-tabs__n { position: absolute; top: 6px; right: calc(50% - 22px); min-width: 18px; height: 18px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; }
    .ga--mobile .ga-cols { display: block; height: auto; overflow: visible; padding-bottom: 58px; }
    .ga--mobile .ga-col { min-height: calc(100dvh - 114px); border-right: 0; }
    .ga--mobile .ga-det__head, .ga--mobile .ga-det__body { padding-left: 14px; padding-right: 14px; }
    .ga--mobile .ga-det__foot { position: sticky; bottom: 58px; padding: 10px 14px; flex-wrap: wrap; }
    .ga--mobile .ga-det__state { flex-basis: 100%; }
    .ga--mobile .ga-toast { bottom: 72px; }
    .ga--mobile .ga-top { padding: 0 10px; }

    /* Tema scuro: tinte che non derivano dai token */
    body.theme-dark { color: var(--text); }
    body.theme-dark .ga-pill--attesa, body.theme-dark .ga-chip--warn .ga-chip__n { background: rgba(249,115,22,.14); color: #fdba74; border-color: rgba(249,115,22,.4); }
