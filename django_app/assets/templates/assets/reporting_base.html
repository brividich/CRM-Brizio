{% extends "assets/base_shell.html" %}
{% block assets_shell_head %}
<style>
.rp{--rp-surface:var(--surface,#fff);--rp-border:var(--border,#dbe3ef);--rp-text:var(--text,#16253c);--rp-muted:var(--text-mid,#66758b);display:grid;gap:20px;min-width:0;color:var(--rp-text)}
.rp .rp-hero{background:linear-gradient(120deg,#12395f,#245c91);padding:26px;border-radius:18px;color:white;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.rp .rp-hero h1{color:white;margin:0 0 8px;font-size:28px}.rp .rp-hero p{margin:0;opacity:.85;max-width:760px}
.rp .rp-panel{padding:22px;border:1px solid var(--rp-border);border-radius:16px;background:var(--rp-surface);min-width:0}.rp h2{font-size:18px;margin:0 0 16px}.rp .rp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.rp .rp-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.rp .rp-muted{color:var(--rp-muted)}.rp .rp-field label{display:block;font-weight:650;margin:0 0 6px}.rp .rp-field input:not([type=checkbox]),.rp .rp-field select{width:100%;padding:10px;border:1px solid var(--rp-border);border-radius:9px;background:var(--rp-surface);color:inherit}.rp .rp-help{font-size:12px;color:var(--rp-muted);margin-top:6px}.rp .errorlist{color:#dc2626}.rp .rp-button{border:1px solid #2563eb;background:#2563eb;color:white;padding:9px 14px;border-radius:9px;text-decoration:none;cursor:pointer;font:inherit;font-weight:650}.rp .rp-button.secondary{background:var(--rp-surface);color:var(--rp-text);border-color:var(--rp-border)}.rp .rp-table-wrap{overflow:auto}.rp table{width:100%;border-collapse:collapse}.rp th,.rp td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--rp-border);vertical-align:top}.rp th{color:var(--rp-muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.rp .rp-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.rp .rp-kpi{border:1px solid var(--rp-border);border-radius:13px;padding:17px;background:var(--rp-surface)}.rp .rp-kpi strong{display:block;font-size:30px;margin-top:5px}.rp .rp-badge{display:inline-block;border-radius:18px;background:color-mix(in srgb,var(--rp-muted) 12%,transparent);padding:4px 9px;font-size:12px;white-space:nowrap}.rp .rp-badge.DONE{color:#15803d;background:#dcfce7}.rp .rp-badge.ERROR{color:#b91c1c;background:#fee2e2}.rp .rp-chart{width:100%;height:auto;max-height:250px}.rp .rp-empty{padding:24px;text-align:center;color:var(--rp-muted)}.rp a:not(.rp-button){color:var(--link,#2563eb)}
@media(max-width:760px){.rp .rp-grid{grid-template-columns:1fr}.rp .rp-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.rp .rp-panel{padding:16px}.rp .rp-hero{padding:20px}}
</style>
{% endblock %}
{% block assets_shell_title %}Reportistica Asset{% endblock %}
{% block assets_shell_content %}<div class="rp">{% block reporting_content %}{% endblock %}</div>{% endblock %}
