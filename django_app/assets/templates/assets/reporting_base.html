{% extends "assets/base_shell.html" %}
{% block assets_shell_head %}
<style>
.rp{--rp-surface:var(--surface,#fff);--rp-border:var(--border,#dbe3ef);--rp-text:var(--text,#16253c);--rp-muted:var(--text-mid,#66758b);display:grid;gap:20px;min-width:0;color:var(--rp-text)}
.rp .rp-hero{background:linear-gradient(120deg,#12395f,#245c91);padding:26px;border-radius:18px;color:white;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.rp .rp-hero h1{color:white;margin:0 0 8px;font-size:28px}.rp .rp-hero p{margin:0;opacity:.85;max-width:760px}
.rp .rp-panel{padding:22px;border:1px solid var(--rp-border);border-radius:16px;background:var(--rp-surface);min-width:0}.rp h2{font-size:18px;margin:0 0 16px}.rp .rp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.rp .rp-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.rp .rp-muted{color:var(--rp-muted)}.rp .rp-field label{display:block;font-weight:650;margin:0 0 6px}.rp .rp-field input:not([type=checkbox]),.rp .rp-field select{width:100%;padding:10px;border:1px solid var(--rp-border);border-radius:9px;background:var(--rp-surface);color:inherit}.rp .rp-help{font-size:12px;color:var(--rp-muted);margin-top:6px}.rp .errorlist{color:#dc2626}.rp .rp-button{border:1px solid #2563eb;background:#2563eb;color:white;padding:9px 14px;border-radius:9px;text-decoration:none;cursor:pointer;font:inherit;font-weight:650}.rp .rp-button.secondary{background:var(--rp-surface);color:var(--rp-text);border-color:var(--rp-border)}.rp .rp-table-wrap{overflow:auto}.rp table{width:100%;border-collapse:collapse}.rp th,.rp td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--rp-border);vertical-align:top}.rp th{color:var(--rp-muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.rp .rp-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.rp .rp-kpi{border:1px solid var(--rp-border);border-radius:13px;padding:17px;background:var(--rp-surface)}.rp .rp-kpi strong{display:block;font-size:30px;margin-top:5px}.rp .rp-badge{display:inline-block;border-radius:18px;background:color-mix(in srgb,var(--rp-muted) 12%,transparent);padding:4px 9px;font-size:12px;white-space:nowrap}.rp .rp-badge.DONE{color:#15803d;background:#dcfce7}.rp .rp-badge.ERROR{color:#b91c1c;background:#fee2e2}.rp .rp-chart{width:100%;height:auto;max-height:250px}.rp .rp-empty{padding:24px;text-align:center;color:var(--rp-muted)}.rp a:not(.rp-button){color:var(--link,#2563eb)}
.rp .rp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rp .rp-search input{width:100%;padding:12px 14px;border:1px solid var(--rp-border);border-radius:12px;background:var(--rp-surface);color:inherit;font-size:15px}
.rp .rp-area h2{margin:6px 0 12px}.rp .rp-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.rp .rp-card{display:flex;flex-direction:column;gap:8px;padding:18px;border:1px solid var(--rp-border);border-radius:14px;background:var(--rp-surface);min-width:0}.rp .rp-card h3{margin:0;font-size:16px}.rp .rp-card p{margin:0}.rp .rp-card .rp-actions{margin-top:auto;padding-top:6px}
.rp .rp-card-altro{border-style:dashed}.rp .rp-esempio{font-size:12px;color:var(--rp-muted);font-family:ui-monospace,Consolas,monospace;overflow-wrap:anywhere}
.rp .rp-chips{display:flex;flex-wrap:wrap;gap:5px}.rp .rp-chips span{font-size:12px;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--rp-muted) 12%,transparent);color:var(--rp-muted)}
.rp .rp-filtri{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-items:end;margin-bottom:12px}
.rp .rp-colonne{margin:0 0 12px}.rp .rp-colonne summary{cursor:pointer;font-weight:650}.rp .rp-colonne-lista{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px}.rp .rp-colonne-lista label{font-weight:400;white-space:nowrap}
.rp .rp-spacer{flex:1}
.rp .rp-riepilogo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.rp .rp-riepilogo .rp-kpi span{color:var(--rp-muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}.rp .rp-riepilogo .rp-kpi strong{font-size:26px}
.rp .rp-barre{display:grid;gap:7px}.rp .rp-barra{display:grid;grid-template-columns:minmax(90px,240px) 1fr auto;gap:10px;align-items:center;font-size:14px}.rp .rp-barra-etichetta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rp .rp-barra-traccia{height:12px;border-radius:6px;background:color-mix(in srgb,var(--rp-muted) 14%,transparent);overflow:hidden}.rp .rp-barra-traccia span{display:block;height:100%;background:#2563eb;border-radius:6px}.rp .rp-barra-valore{font-variant-numeric:tabular-nums;font-weight:650}
.rp .rp-scroll{max-height:calc(70 * var(--vh, 1vh))}.rp .rp-dati thead th{position:sticky;top:0;background:var(--rp-surface);z-index:1}.rp .rp-dati .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.rp .rp-dati tbody tr:hover{background:color-mix(in srgb,#2563eb 6%,transparent)}
.rp .rp-ordina{color:inherit!important;text-decoration:none}.rp .rp-ordina:hover{text-decoration:underline}.rp .rp-totali th{color:var(--rp-text);font-size:13px;text-transform:none;letter-spacing:0;border-top:2px solid var(--rp-border);position:sticky;bottom:0;background:var(--rp-surface)}
@media(max-width:760px){.rp .rp-grid{grid-template-columns:1fr}.rp .rp-barra{grid-template-columns:minmax(70px,120px) 1fr auto}.rp .rp-spacer{display:none}.rp .rp-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.rp .rp-panel{padding:16px}.rp .rp-hero{padding:20px}}
</style>
{% endblock %}
{% block assets_shell_title %}Reportistica Asset{% endblock %}
{% block assets_shell_content %}<div class="rp">{% block reporting_content %}{% endblock %}</div>{% endblock %}
