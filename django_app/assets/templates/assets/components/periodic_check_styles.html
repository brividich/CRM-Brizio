{% include "assets/components/maintenance_domain_styles.html" %}
<style>
/* Verifiche periodiche: stesso linguaggio md-*, colore di tipologia --mk-chk.
   Solo token di tema (con fallback): valgono anche in dark. */
.pc-kpis .md-kpi{text-decoration:none}
.pc-kpis .md-kpi.is-on{border-color:var(--mk-chk);box-shadow:inset 0 0 0 1px var(--mk-chk)}
.pc-state{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:var(--fs-xs);font-weight:800;white-space:nowrap;background:var(--mk-soft);color:var(--text-mid,#64748b)}
.pc-state::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pc-state.is-overdue{background:rgba(220,38,38,.12);color:var(--mk-late)}
.pc-state.is-due_soon{background:rgba(217,119,6,.14);color:#b45309}
.pc-state.is-ok{background:rgba(22,163,74,.12);color:#15803d}
body.theme-dark .pc-state.is-due_soon{color:#fbbf24}
body.theme-dark .pc-state.is-ok{color:#4ade80}
.pc-outcome{display:inline-block;white-space:nowrap;padding:1px 8px;border-radius:6px;font-size:var(--fs-2xs);font-weight:800;text-transform:uppercase;letter-spacing:.03em;border:1px solid currentColor}
.pc-outcome.is-OK{color:#15803d}
.pc-outcome.is-REMARKS{color:#b45309}
.pc-outcome.is-KO{color:var(--mk-late)}
.pc-outcome.is-ARCHIVE{color:var(--text-mid,#64748b)}
body.theme-dark .pc-outcome.is-OK{color:#4ade80}
body.theme-dark .pc-outcome.is-REMARKS{color:#fbbf24}
.pc-system .md-section-head h2{display:flex;gap:8px;align-items:center}
.pc-system .md-section-head h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--mk-chk)}
.pc-table td{vertical-align:middle}
/* Tabelle per impianto: stesse colonne in tutte, niente scroll interno. */
.pc-system .md-scroll{max-height:none}
.pc-table{table-layout:fixed;width:100%;min-width:980px}
.pc-table .pc-c-name{width:auto}
.pc-table .pc-c-freq{width:128px}
.pc-table .pc-c-who{width:190px}
.pc-table .pc-c-last{width:170px}
.pc-table .pc-c-next{width:130px}
.pc-table .pc-c-state{width:130px}
.pc-table .pc-c-act{width:250px}
.pc-actions{flex-wrap:nowrap}
.pc-name a{font-weight:800;text-decoration:none;color:var(--text,#0f172a)}
.pc-name a:hover{text-decoration:underline}
.pc-date{display:block;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text,#0f172a)}
.pc-days{font-size:var(--fs-xs);color:var(--text-mid,#64748b);white-space:nowrap}
.pc-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.pc-actions .btn{padding:4px 10px;font-size:var(--fs-xs)}
.pc-flag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;background:var(--mk-chk-bg);color:var(--mk-chk);font-size:var(--fs-2xs);font-weight:800}
.pc-flag.is-ko{background:rgba(220,38,38,.12);color:var(--mk-late)}
.pc-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 20px;padding:14px 16px;margin:0}
.pc-facts div{display:grid;gap:2px}
.pc-facts dt{font-size:var(--fs-2xs);font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--text-mid,#64748b)}
.pc-facts dd{margin:0;font-size:var(--fs-sm);color:var(--text,#0f172a)}
.pc-files{display:flex;gap:8px;flex-wrap:wrap}
.pc-file{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:8px;border:1px solid var(--border,#dbe1ea);font-size:var(--fs-xs);text-decoration:none;color:var(--text,#0f172a);max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-file:hover{border-color:var(--mk-chk)}
.pc-checklist{display:grid;gap:0}
.pc-check{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(160px,260px);gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border,#e5e7eb)}
.pc-check:last-child{border-bottom:0}
.pc-check-label{font-weight:700;color:var(--text,#0f172a)}
.pc-seg{display:inline-flex;border:1px solid var(--border,#cbd5e1);border-radius:8px;overflow:hidden}
.pc-seg label{display:inline-flex;align-items:center;padding:6px 12px;font-size:var(--fs-xs);font-weight:800;cursor:pointer;color:var(--text-mid,#64748b)}
.pc-seg label + label{border-left:1px solid var(--border,#cbd5e1)}
.pc-seg input{position:absolute;opacity:0;pointer-events:none}
.pc-seg input:checked + span{color:#fff}
.pc-seg label:has(input:checked){background:var(--mk-chk);color:var(--surface,#fff)}
.pc-seg label.is-ko:has(input:checked){background:var(--mk-late);color:var(--surface,#fff)}
.pc-seg label.is-na:has(input:checked){background:var(--text-mid,#64748b)}
.pc-check input[type=text]{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--border,#cbd5e1);border-radius:8px;background:var(--surface,#fff);color:inherit}
.pc-wo{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pc-wo select,.pc-wo input{font:inherit;padding:4px 6px;border:1px solid var(--border,#cbd5e1);border-radius:8px;background:var(--surface,#fff);color:inherit;max-width:260px}
.pc-muted{color:var(--text-mid,#64748b);font-size:var(--fs-sm)}
.pc-draft{border:1px solid #fcd34d;background:rgba(217,119,6,.09);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pc-point{grid-template-columns:minmax(0,1fr) auto}
.pc-steps{margin:0;padding-left:20px;display:grid;gap:8px;color:var(--text,#0f172a)}
.pc-steps .btn{margin-left:6px}
.pc-overlay{display:block;max-width:980px}
.pc-overlay img{display:block;width:100%;height:auto;border:1px solid var(--border,#dbe1ea);border-radius:10px;background:#fff}
.pc-table-auto td{vertical-align:middle}
/* Scheda verifica: colori dello stato dei punti e delle serie (provvisori, validati in chiaro). */
body{--pc-cat0:#d42a2a;--pc-cat1:#c98500;--pc-ok:#16a34a;--pc-other:#64748b;--pc-unknown:#94a3b8}
body.theme-dark{--pc-ok:#4ade80;--pc-other:#94a3b8;--pc-unknown:#64748b}
.pc-tabs{margin-bottom:2px}
.pc-kpi-date{font-size:var(--fs-lg,1.25rem)}
.pc-h-sub{font-size:var(--fs-sm);font-weight:600}
.pc-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0;padding:0;list-style:none;font-size:var(--fs-xs);color:var(--text-mid,#64748b)}
.pc-legend li{display:inline-flex;align-items:center;gap:6px}
.pc-key{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pc-unknown);vertical-align:middle}
.pc-key.is-cat0,.pc-key.is-s0{background:var(--pc-cat0)}
.pc-key.is-cat1,.pc-key.is-s1{background:var(--pc-cat1)}
.pc-key.is-s2,.pc-key.is-s3{background:var(--pc-other)}
.pc-key.is-ok{background:var(--pc-ok);width:7px;height:7px}
.pc-key.is-fixed{background:transparent;box-shadow:inset 0 0 0 2px var(--pc-ok)}
.pc-map-wrap{padding:12px 16px;display:grid;gap:10px}
.pc-map{position:relative;width:100%;max-width:760px;height:0;border:1px solid var(--border,#dbe1ea);border-radius:10px;overflow:hidden;background:#fff}
.pc-map img{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.pc-pt{position:absolute;transform:translate(-50%,-50%);width:6px;height:6px;border-radius:50%;background:var(--pc-unknown);text-decoration:none}
.pc-pt.is-ok{background:var(--pc-ok)}
.pc-pt.is-cat0,.pc-pt.is-cat1,.pc-pt.is-fixed{width:13px;height:13px;box-shadow:0 0 0 2px #fff}
.pc-pt.is-cat0{background:var(--pc-cat0)}
.pc-pt.is-cat1{background:var(--pc-cat1)}
.pc-pt.is-fixed{background:#fff;box-shadow:inset 0 0 0 3px var(--pc-ok),0 0 0 2px #fff}
.pc-pt span{position:absolute;left:15px;top:50%;transform:translateY(-50%);padding:0 4px;border-radius:4px;background:#fff;color:#0f172a;font-size:10px;font-weight:800;line-height:14px;white-space:nowrap;box-shadow:0 0 0 1px rgba(15,23,42,.18)}
.pc-chart{padding:12px 16px 14px;display:grid;gap:10px}
.pc-chart-plot{position:relative;padding-left:26px}
.pc-chart-plot svg{display:block;width:100%;height:190px;overflow:visible}
.pc-chart-max{position:absolute;left:0;top:4px;font-size:var(--fs-2xs);color:var(--text-mid,#64748b);font-variant-numeric:tabular-nums}
.pc-axis{stroke:var(--border,#cbd5e1);stroke-width:1;vector-effect:non-scaling-stroke}
.pc-grid{stroke:var(--border,#e5e7eb);stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.pc-hit{fill:transparent}
.pc-bar:hover .pc-hit{fill:var(--mk-soft)}
.pc-seg-s0{fill:var(--pc-cat0)}
.pc-seg-s1{fill:var(--pc-cat1)}
.pc-seg-s2,.pc-seg-s3{fill:var(--pc-other)}
.pc-chart-x{display:grid;gap:0;margin-top:4px}
.pc-chart-x a{display:grid;justify-items:center;text-decoration:none;color:var(--text-mid,#64748b);font-size:var(--fs-2xs)}
.pc-chart-x strong{color:var(--text,#0f172a);font-size:var(--fs-xs);font-variant-numeric:tabular-nums}
.pc-guide-steps{list-style:none;margin:0;padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pc-guide-step{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border,#dbe1ea);border-radius:12px;background:var(--surface,#fff)}
.pc-guide-step.is-next{border-color:var(--mk-chk);box-shadow:inset 0 0 0 1px var(--mk-chk);background:var(--mk-chk-bg)}
.pc-guide-step.is-waiting,.pc-guide-step.is-blocked{opacity:.7}
.pc-guide-n{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--mk-soft);color:var(--text,#0f172a);font-weight:800;font-size:var(--fs-xs)}
.pc-guide-step.is-done .pc-guide-n{background:rgba(22,163,74,.15);color:var(--pc-ok)}
.pc-guide-step.is-next .pc-guide-n{background:var(--mk-chk);color:var(--surface,#fff)}
.pc-guide-body{display:grid;gap:4px;font-size:var(--fs-sm);color:var(--text,#0f172a)}
.pc-guide-body > span{color:var(--text-mid,#64748b);font-size:var(--fs-xs)}
.pc-guide-body .btn,.pc-guide-body form{justify-self:start;margin-top:2px}
.pc-codes{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.pc-codes span{padding:1px 6px;border-radius:6px;background:var(--mk-soft);font-size:var(--fs-2xs);font-weight:700;font-variant-numeric:tabular-nums}
.pc-actions form{display:inline-flex;margin:0}
@media (max-width:800px){.pc-check{grid-template-columns:1fr}}
</style>
