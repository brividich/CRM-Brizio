{# Partial: form modifica voce sidebar. Variabile: item (AssetSidebarButton) #}
{# Il form di eliminazione sta FUORI dal form di modifica: i form annidati non esistono in HTML, il browser fonde i campi e "Salva" inviava action=delete_sidebar_button. #}
<form id="sidebar-edit-{{ item.id }}" method="post" style="display:grid;gap:10px;">
  {% csrf_token %}
  <input type="hidden" name="action" value="update_sidebar_button">
  <input type="hidden" name="sidebar_button_id" value="{{ item.id }}">
  <div class="sidebar-editor-grid meta">
    <div class="form-group">
      <label>Etichetta</label>
      <input type="text" name="label" value="{{ item.label }}" required>
    </div>
    <div class="form-group">
      <label>Sezione</label>
      <select name="section">
        {% for section_code, section_label in sidebar_section_choices %}
          <option value="{{ section_code }}" {% if item.section == section_code %}selected{% endif %}>{{ section_label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Voce padre</label>
      <select name="parent_sidebar_button_id">
        <option value="">Nessuna (primo livello)</option>
        {% for parent_item in sidebar_parent_choices %}{% if parent_item.id != item.id %}
          <option value="{{ parent_item.id }}" {% if item.parent_id == parent_item.id %}selected{% endif %}>{{ parent_item.label }}</option>
        {% endif %}{% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Ordine</label>
      <input type="number" name="sort_order" value="{{ item.sort_order }}">
    </div>
  </div>
  <div class="sidebar-editor-grid routes">
    <div class="form-group" style="max-width:none;">
      <label>URL destinazione</label>
      <input type="text" name="target_url" list="assets-sidebar-target-options" value="{{ item.target_url }}">
    </div>
    <div class="form-group" style="max-width:none;">
      <label>Criterio attivo</label>
      <input type="text" name="active_match" list="assets-sidebar-active-match-options" value="{{ item.active_match }}">
    </div>
  </div>
</form>
<form id="sidebar-delete-{{ item.id }}" method="post" style="display:none;" onsubmit="return confirm('Eliminare &quot;{{ item.label|escapejs }}&quot;?')">
  {% csrf_token %}
  <input type="hidden" name="action" value="delete_sidebar_button">
  <input type="hidden" name="sidebar_button_id" value="{{ item.id }}">
</form>
<div class="sidebar-editor-footer">
  <div class="sidebar-editor-flags">
    <label class="sidebar-editor-check"><input type="checkbox" form="sidebar-edit-{{ item.id }}" name="is_subitem" value="1" {% if item.is_subitem %}checked{% endif %}> Sottovoce</label>
    <label class="sidebar-editor-check"><input type="checkbox" form="sidebar-edit-{{ item.id }}" name="is_visible" value="1" {% if item.is_visible %}checked{% endif %}> Visibile</label>
  </div>
  <div class="sidebar-editor-actions">
    <button type="submit" form="sidebar-delete-{{ item.id }}" class="btn btn-danger btn-sm">Elimina</button>
    <button type="submit" form="sidebar-edit-{{ item.id }}" class="btn btn-primary btn-sm">Salva</button>
  </div>
</div>
