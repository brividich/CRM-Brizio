{% if messages %}
<div style="margin-top:14px;">
  {% for m in messages %}
  <div class="gs-banner {% if m.tags == 'error' %}gs-banner--danger{% elif m.tags == 'warning' %}gs-banner--warn{% else %}gs-banner--ai{% endif %}" style="margin-bottom:8px;">
    <div class="gs-banner__ic">{% include "gestione_specifiche/partials/_icon.html" with name="alert" size=16 %}</div>
    <div style="flex:1; align-self:center; font-size:12.5px; color:#1c2b42; line-height:1.5;">{{ m }}</div>
  </div>
  {% endfor %}
</div>
{% endif %}
