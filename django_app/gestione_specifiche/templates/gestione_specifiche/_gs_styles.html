{# Stili condivisi gestione_specifiche (design system HUB: navy/cyan/orange) #}
<style>
  .gs-card { border:1px solid #e3e9f2; border-radius:14px; background:#fff; padding:16px 18px; margin-bottom:16px; box-shadow:0 10px 24px rgba(12,37,69,.05); }
  .gs-head { border:1px solid #d9e2ef; border-radius:14px; padding:16px 18px; margin-bottom:16px;
    background:linear-gradient(135deg,#fff 0%,#f7faff 60%,#eef6ff 100%); position:relative; overflow:hidden; }
  .gs-head:before { content:""; position:absolute; left:0; top:0; bottom:0; width:6px;
    background:linear-gradient(180deg,#0c2545,#1f87cd 55%,#ff8a1f); }
  .gs-head h1 { margin:0 0 0 8px; font-size:1.45rem; color:#0c2545; }
  .gs-head p { margin:4px 0 0 8px; color:#6c84a6; font-size:.9rem; }
  .gs-pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:.78rem; font-weight:700; }
  .gs-pill.bozza { background:#eef2f8; color:#51607a; }
  .gs-pill.flow_down { background:#fff3e0; color:#b35b00; }
  .gs-pill.in_validita { background:#e3f6ec; color:#1c7a45; }
  .gs-pill.superato, .gs-pill.duplicato { background:#eceff4; color:#7a8699; }
  .gs-pill.sospeso { background:#fff8d6; color:#8a6d00; }
  .gs-pill.annullato, .gs-pill.respinto { background:#fde8e8; color:#b42318; }
  .gs-pill.errore_tecnico { background:#f3e0ff; color:#7a1fb3; }
  .gs-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px 18px; }
  .gs-grid .lbl { color:#6c84a6; font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; }
  .gs-grid .val { color:#24395e; font-weight:600; }
  .gs-btn { display:inline-flex; align-items:center; gap:6px; min-height:38px; padding:8px 14px; border-radius:10px;
    border:1px solid #cdd9ea; background:#fff; color:#24395e; font-weight:700; text-decoration:none; cursor:pointer; }
  .gs-btn--primary { background:#0c2545; color:#fff; border-color:#0c2545; }
  .gs-btn--accent { background:#ff8a1f; color:#fff; border-color:#ff8a1f; }
  .gs-btn--ghost { background:#f4f8ff; }
  .gs-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; }
  .gs-input { width:100%; padding:8px 10px; border:1px solid #cdd9ea; border-radius:8px; font-size:.9rem; box-sizing:border-box; }
  .gs-input--num { width:80px; }
  .gs-table { width:100%; border-collapse:collapse; background:#fff; }
  .gs-table th, .gs-table td { padding:8px 10px; text-align:left; border-bottom:1px solid #eef2f8; font-size:.88rem; vertical-align:top; }
  .gs-table th { background:#f4f8ff; color:#24395e; font-weight:700; }
  .gs-evt { font-size:.84rem; color:#51607a; border-left:2px solid #d9e2ef; padding:4px 0 4px 12px; margin-left:6px; }
  .gs-evt b { color:#24395e; }
</style>
