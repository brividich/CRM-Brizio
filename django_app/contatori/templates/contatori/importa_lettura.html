{% extends "contatori/_base_modulo.html" %}
{% block modulo %}
<h1>Nuova lettura</h1>
<p class="sub">Inserimento manuale di una rilevazione contatori.</p>
<form method="post" class="form-sezioni">{% csrf_token %}
  {% include "contatori/_form_sezioni.html" %}
  <div class="form-actions">
    <a class="btn ghost" href="{% url 'contatori:dashboard' %}">Annulla</a>
    <button class="btn" type="submit">Salva lettura</button>
  </div>
</form>
{% endblock %}
