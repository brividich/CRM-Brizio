<div class="form-field{% if field.name in form.campi_full %} full{% endif %}{% if field.errors %} has-error{% endif %}">
  {% if field.widget_type == "checkbox" %}<label class="check-field">{{ field }}<span>{{ field.label }}</span></label>
  {% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="req" aria-hidden="true">*</span>{% endif %}</label>{{ field }}{% endif %}
  {% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}{{ field.errors }}
</div>
