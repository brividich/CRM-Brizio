<style>
.pres{ max-width:1280px; margin:0 auto; padding:18px 16px 40px; color:var(--text); }
.pres-head{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:14px; }
.pres-head h1{ margin:0; font-size:24px; font-weight:800; display:flex; align-items:center; gap:10px; }
.pres-head p{ margin:4px 0 0; color:var(--text-mid); font-size:13.5px; }
.pres-azioni{ display:flex; flex-wrap:wrap; gap:8px; }
.pres-btn{ display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 14px; border-radius:10px;
  border:1px solid var(--border); background:var(--surface); color:var(--text); font-weight:700; font-size:13px;
  text-decoration:none; cursor:pointer; }
.pres-btn:hover{ border-color:var(--accent); }
.pres-btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.pres-btn-danger{ background:var(--danger); border-color:var(--danger); color:#fff; }
.pres-btn-big{ min-height:52px; padding:0 22px; font-size:16px; border-radius:14px; }
.pres-nav{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--border); }
.pres-nav a{ padding:9px 14px; font-size:13.5px; font-weight:700; color:var(--text-mid); text-decoration:none;
  border-bottom:3px solid transparent; margin-bottom:-1px; }
.pres-nav a:hover{ color:var(--text); }
.pres-nav a.is-on{ color:var(--text); border-bottom-color:var(--accent); }
.pres-nav .pres-nav-guida{ margin-left:auto; }
.pres-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; }
.pres-kpi{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
.pres-kpi .pres-card{ display:flex; flex-direction:column; gap:2px; }
.pres-kpi b{ font-size:28px; font-weight:800; line-height:1.1; }
.pres-kpi span{ font-size:12px; font-weight:700; color:var(--text-mid); }
.pres-kpi i{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
.pres-avviso{ padding:11px 14px; border-radius:12px; border:1px solid var(--warning); background:var(--warning-bg);
  color:var(--text); font-size:13.5px; margin-bottom:14px; }
.pres-avviso.is-err{ border-color:var(--danger); background:var(--danger-bg); }
.pres-avviso.is-ok{ border-color:var(--success); background:var(--success-bg); }
.pres-filtri{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
.pres-filtri input, .pres-filtri select{ min-height:36px; padding:0 10px; border:1px solid var(--border); border-radius:10px;
  background:var(--surface); color:var(--text); font-size:13.5px; }
.pres-filtri input[type=search]{ flex:1 1 220px; }
.pres-live{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--text-mid); }
.pres-live::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--success);
  animation:pres-pulse 2s infinite; }
@keyframes pres-pulse{ 0%{ box-shadow:0 0 0 0 rgba(22,163,74,.6); } 70%{ box-shadow:0 0 0 8px rgba(22,163,74,0); } 100%{ box-shadow:0 0 0 0 rgba(22,163,74,0); } }
.pres-tab{ width:100%; border-collapse:collapse; font-size:13.5px; }
.pres-tab th{ text-align:left; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--text-mid);
  padding:8px 10px; border-bottom:1px solid var(--border); background:var(--thead-bg); position:sticky; top:0; }
.pres-tab td{ padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
.pres-tab tr:hover td{ background:var(--tbody-hover); }
.pres-tab .pres-c{ text-align:center; }
.pres-mono{ font-family:var(--hub-mono,ui-monospace,monospace); font-size:12.5px; }
.pres-nome{ font-weight:700; }
.pres-nome a{ color:inherit; text-decoration:none; }
.pres-nome a:hover{ text-decoration:underline; }
.pres-sub{ display:block; font-size:12px; color:var(--text-mid); font-weight:400; }
.pres-inc{ display:inline-block; padding:2px 8px; margin:1px 2px 1px 0; border-radius:999px; font-size:11.5px; font-weight:700;
  color:#fff; white-space:nowrap; }
.pres-turno{ display:inline-block; min-width:22px; padding:1px 6px; border-radius:6px; background:var(--surface-alt);
  font-weight:800; font-size:12px; }
.pres-vuoto{ padding:28px; text-align:center; color:var(--text-mid); }
.pres-piede{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; margin-top:10px; font-size:12px; color:var(--text-mid); }
/* Appello */
.pres-progress{ height:14px; border-radius:999px; background:var(--surface-alt); overflow:hidden; margin:8px 0 4px; }
.pres-progress span{ display:block; height:100%; background:var(--success); transition:width .3s; }
.pres-appello{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px; }
.pres-persona{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px; border:2px solid var(--border);
  background:var(--surface); cursor:pointer; text-align:left; width:100%; color:var(--text); font:inherit; }
.pres-persona:hover{ border-color:var(--accent); }
.pres-persona .pres-check{ flex:0 0 30px; height:30px; border-radius:8px; border:2px solid var(--border); display:flex;
  align-items:center; justify-content:center; font-size:18px; font-weight:900; color:#fff; }
.pres-persona.is-contato{ border-color:var(--success); background:var(--success-bg); }
.pres-persona.is-contato .pres-check{ background:var(--success); border-color:var(--success); }
.pres-persona .pres-chi{ display:block; font-size:11.5px; color:var(--text-mid); }
.pres-gruppo{ margin:16px 0 8px; font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--text-mid); }
.pres-form{ display:grid; gap:12px; max-width:720px; }
.pres-form label{ display:grid; gap:4px; font-size:13px; font-weight:700; }
.pres-form input[type=text]{ min-height:36px; padding:0 10px; border:1px solid var(--border); border-radius:10px;
  background:var(--surface); color:var(--text); font-weight:400; }
.pres-form .pres-check-row{ display:flex; align-items:center; gap:8px; }
.pres-form small{ font-weight:400; color:var(--text-mid); }
@media (max-width:720px){
  .pres-tab .pres-hide-sm{ display:none; }
  .pres-head h1{ font-size:20px; }
  .pres-nav{ flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
  .pres-nav a{ white-space:nowrap; padding:9px 10px; }
  .pres-nav .pres-nav-guida{ margin-left:0; }
}
@media print{
  .pres-nav, .pres-azioni, .pres-filtri, .subnav{ display:none !important; }
}
</style>
