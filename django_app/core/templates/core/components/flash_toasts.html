{# Toast dei messaggi flash. Comportamento in core/js/hub-flash.js, consegna in core/flash_messages.py #}
<div class="hub-flash-stack" data-hub-flash-stack aria-live="polite" aria-atomic="false">
  {% for item in flash_items %}
    <div class="hub-flash hub-flash-{{ item.level }}" role="{% if item.level == 'error' %}alert{% else %}status{% endif %}" data-hub-flash-key="{{ item.level }}|{{ item.text }}" data-count="{{ item.count }}">
      <div class="hub-flash-body">
        <span class="hub-flash-text">{{ item.summary }}</span>
        <span class="hub-flash-count"{% if item.count < 2 %} hidden{% endif %}>&times;{{ item.count }}</span>
        {% if item.long %}
          <button type="button" class="hub-flash-more" aria-expanded="false">Dettagli</button>
          <div class="hub-flash-detail" hidden>{{ item.text }}</div>
        {% endif %}
      </div>
      <button type="button" class="hub-flash-close" aria-label="Chiudi messaggio">&times;</button>
    </div>
  {% endfor %}
</div>
