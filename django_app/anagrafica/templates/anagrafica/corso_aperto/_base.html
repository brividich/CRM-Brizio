{% load static %}<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}{{ corso.titolo }}{% endblock %} | Costruzioni Novicrom</title>
<style nonce="{{ csp_nonce }}">
/* Modello grafico delle pagine pubbliche NOVICROM HUB (come reception/pubblica/_base.html). */
:root { --bg:#eef3f8; --card:#fff; --text:#182232; --muted:#64748b; --border:#d8e1ec; --accent:#002b5c; --accent-soft:#e1ebf6; --err-bg:#fee2e2; --err:#991b1b; --ok-bg:#dcfce7; --ok:#166534; --field:#fff; --head:#002b5c; --hub-arancio:#ff6b00; }
@media (prefers-color-scheme: dark) { :root { --bg:#0a1222; --card:#111c33; --text:#e2e8f0; --muted:#94a3b8; --border:#334155; --accent:#7cb3ec; --accent-soft:#12345c; --err-bg:rgba(229,62,62,.18); --err:#fca5a5; --ok-bg:rgba(34,197,94,.16); --ok:#86efac; --field:#0f1a2e; --head:#002b5c; } }
* { box-sizing:border-box; }
body { margin:0; overflow-x:hidden; min-height:100vh; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; }
.pb-barra { background:#fff; border-bottom:5px solid var(--hub-arancio); padding:12px 16px; }
.pb-barra-in { max-width:820px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.pb-barra img { display:block; height:40px; width:auto; }
.pb-barra span { color:#64748b; font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; }
.pb-head { background:var(--head); color:#f8fafc; padding:18px 16px 62px; }
.pb-head-in { max-width:820px; margin:0 auto; }
.pb-head h1 { margin:0; font-size:24px; letter-spacing:-.01em; color:#fff; }
.pb-head p { margin:4px 0 0; color:#c7d6e8; font-size:14px; }
.pb-wrap { max-width:820px; margin:-44px auto 32px; padding:0 16px; }
.pb-card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:24px; box-shadow:0 18px 45px rgba(15,23,42,.16); }
.pb-card h2 { font-size:21px; margin:0 0 12px; }
.pb-bar { height:6px; border-radius:99px; background:var(--accent-soft); overflow:hidden; margin-bottom:14px; }
.pb-bar span { display:block; height:100%; background:var(--hub-arancio); }
.pb-meta { font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.05em; text-transform:uppercase; margin-bottom:8px; }
.pb-corpo { font-size:16px; line-height:1.6; overflow-wrap:anywhere; }
.pb-corpo img, .pb-media { display:block; max-width:100%; height:auto; border-radius:10px; }
.pb-video { width:100%; max-height:70vh; border-radius:10px; background:#000; }
.pb-nav { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:20px; flex-wrap:wrap; }
.pb-btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--accent); color:#fff; border:0; border-radius:12px; padding:13px 22px; font-size:16px; font-weight:700; cursor:pointer; text-decoration:none; }
.pb-btn[aria-disabled="true"] { opacity:.45; pointer-events:none; }
.pb-btn-ghost { background:transparent; color:var(--accent); border:1px solid var(--border); }
.pb-btn-full { width:100%; margin-top:18px; }
.pb-attesa { font-size:14px; color:var(--muted); }
.pb-domanda { border:1px solid var(--border); border-radius:14px; padding:16px; margin:0 0 14px; }
.pb-domanda legend { font-weight:700; font-size:15px; padding:0 6px; }
.pb-opz { display:flex; gap:10px; align-items:flex-start; padding:9px 4px; font-size:15px; cursor:pointer; }
.pb-opz input { width:20px; height:20px; flex:none; margin-top:1px; accent-color:var(--accent); }
.pb-help { font-size:13px; color:var(--muted); margin:2px 0 8px; }
.pb-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
.pb-field { display:flex; flex-direction:column; gap:6px; }
.pb-field label { font-size:13px; font-weight:600; }
.pb-field input { width:100%; font:inherit; font-size:16px; color:var(--text); background:var(--field); border:1px solid var(--border); border-radius:10px; padding:11px 12px; }
.pb-chi { margin-top:6px; padding:16px; border-radius:14px; background:var(--accent-soft); }
.pb-chi h3 { margin:0 0 4px; font-size:16px; }
.pb-errori { background:var(--err-bg); color:var(--err); border-radius:12px; padding:12px 16px; margin-bottom:16px; font-size:14px; }
.pb-errori ul { margin:0; padding-left:18px; }
.pb-esito { border-radius:14px; padding:16px; font-size:15px; line-height:1.55; }
.pb-esito.ok { background:var(--ok-bg); color:var(--ok); }
.pb-esito.ko { background:var(--err-bg); color:var(--err); }
.pb-trappola { position:absolute; left:-10000px; width:1px; height:1px; overflow:hidden; }
.pb-piede { margin:14px 0 0; text-align:center; color:#94a3b8; font-size:11px; }
@media (max-width:560px) { .pb-grid { grid-template-columns:minmax(0,1fr); } .pb-card { padding:18px; } .pb-btn { flex:1; } }
</style>
</head>
<body>
<div class="pb-barra"><div class="pb-barra-in"><img src="{% static 'core/img/novicrom_hub.png' %}" alt="NOVICROM HUB · Costruzioni Novicrom" width="160" height="40"><span>Formazione</span></div></div>
<header class="pb-head"><div class="pb-head-in"><h1>{{ corso.titolo }}</h1>{% block sottotitolo %}{% endblock %}</div></header>
<div class="pb-wrap"><div class="pb-card">{% block corpo %}{% endblock %}</div>
<p class="pb-piede">Costruzioni Novicrom Srl · NOVICROM HUB</p></div>
{% block script %}{% endblock %}
</body>
</html>
