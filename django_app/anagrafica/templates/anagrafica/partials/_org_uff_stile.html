{# Stile dei riquadri dell'organigramma ufficiale: lo stesso in tela, versione in vigore, anteprime e stampa. #}
<style>
.ouf-tela { position:relative; }
.ouf-linee { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
.ouf-linee path { fill:none; stroke:#94a3b8; stroke-width:1.6; }
.ouf-linee path.is-staff { stroke-dasharray:6 4; }
.ouf-g {
  position:absolute; box-sizing:border-box; border-radius:14px;
  border:1.5px solid color-mix(in srgb, var(--c, #4f46e5) 40%, #fff);
  background:color-mix(in srgb, var(--c, #4f46e5) 7%, transparent);
}
.ouf-g > .ouf-gt {
  position:absolute; top:-11px; left:14px; max-width:calc(100% - 28px);
  background:var(--c, #4f46e5); color:#fff; font-size:11px; font-weight:700;
  padding:3px 10px; border-radius:999px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ouf-b {
  position:absolute; box-sizing:border-box; display:flex; align-items:center; gap:8px;
  padding:6px 9px; background:#fff; color:#0f1f3a; border:1px solid #d3dbe7;
  border-left:4px solid var(--c, #0f2a5c); border-radius:10px; box-shadow:0 1px 3px rgba(15,31,58,.08);
  overflow:hidden;
}
.ouf-b--pieno { background:var(--c, #0f2a5c); border-color:var(--c, #0f2a5c); color:#fff; }
.ouf-b--pieno .ouf-s { color:rgba(255,255,255,.78); }
.ouf-b--pieno .ouf-av { background:#fff; color:var(--c, #0f2a5c); }
.ouf-b--tratteggio { border:1.5px dashed var(--c, #64748b); background:#f8fafc; }
.ouf-av {
  width:30px; height:30px; flex:none; border-radius:8px; display:grid; place-items:center;
  background:color-mix(in srgb, var(--c, #0f2a5c) 12%, #fff); color:var(--c, #0f2a5c);
  font-weight:800; font-size:13px; overflow:hidden;
}
.ouf-av img { width:100%; height:100%; object-fit:cover; }
.ouf-tx { min-width:0; display:flex; flex-direction:column; }
.ouf-t { font-weight:700; font-size:12px; line-height:1.2; overflow:hidden; text-overflow:ellipsis;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.ouf-s { font-size:10px; color:#64748b; text-transform:uppercase; letter-spacing:.03em; margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
body.theme-dark .ouf-b:not(.ouf-b--pieno) { background:#16233a; color:#e2e8f0; border-color:#2b3a55; }
body.theme-dark .ouf-b--tratteggio { background:#111c2e; }
body.theme-dark .ouf-s { color:#94a3b8; }
@media print { .ouf-b, .ouf-g, .ouf-g > .ouf-gt { -webkit-print-color-adjust:exact; print-color-adjust:exact; } }
</style>
