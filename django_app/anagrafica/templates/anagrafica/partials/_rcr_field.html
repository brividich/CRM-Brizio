{% if field.field.widget.input_type == "checkbox" %}
<div class="rcr-f rcr-f-check{% if wide %} rcr-wide{% endif %}">
  {{ field }}
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% if field.errors %}<span class="rcr-err">{{ field.errors.0 }}</span>{% endif %}
</div>
{% else %}
<div class="rcr-f{% if wide %} rcr-wide{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<span class="rcr-help">{{ field.help_text }}</span>{% endif %}
  {% if field.errors %}<span class="rcr-err">{{ field.errors.0 }}</span>{% endif %}
</div>
{% endif %}
