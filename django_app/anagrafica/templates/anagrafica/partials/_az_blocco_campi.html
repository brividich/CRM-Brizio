{% comment %}Campi di un blocco della card «Anagrafica aziendale» (form da AZIENDALE_BLOCCHI).{% endcomment %}
<div class="dp-form-grid">
  {% for field in form %}
  {% if field.field.widget.input_type == "checkbox" %}
  <label class="dp-blocco-check" for="{{ field.id_for_label }}">{{ field }} {{ field.label }}</label>
  {% else %}
  <div class="dp-form-field"{% if field.name == "motivo_esclusione_conteggi" %} data-dp-motivo-esclusione{% endif %}>
    <label class="dp-form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<span class="dp-blocco-hint">{{ field.help_text }}</span>{% endif %}
  </div>
  {% endif %}
  {% endfor %}
</div>
