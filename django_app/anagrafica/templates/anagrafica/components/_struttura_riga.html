{% comment %}Riga competenza dell'editor della Struttura. r = dict con i (indice), id, nome, …{% endcomment %}
<tr{% if not r.id %} class="mst-nuova-r"{% endif %}>
  <td><input type="hidden" name="r{{ r.i }}_id" value="{{ r.id|default:'' }}">
    <input type="text" name="r{{ r.i }}_nome" value="{{ r.nome }}" maxlength="150" placeholder="{% if r.id %}Nome{% else %}Nuova competenza{% endif %}" aria-label="Nome della competenza"></td>
  <td><select name="r{{ r.i }}_livello_minimo" aria-label="Livello minimo">
    {% for codice, etichetta in livelli_label %}<option value="{{ codice }}"{% if codice == r.livello_minimo %} selected{% endif %}>{{ codice }} · {{ etichetta }}</option>{% endfor %}
  </select></td>
  <td class="mst-c"><input type="checkbox" name="r{{ r.i }}_bloccante"{% if r.bloccante %} checked{% endif %} aria-label="Bloccante"></td>
  <td><select name="r{{ r.i }}_corso" aria-label="Corso richiesto">
    <option value="">—</option>
    {% for c in corsi_opts %}<option value="{{ c.id }}"{% if c.id == r.corso_id %} selected{% endif %}>{{ c.titolo|truncatechars:60 }}</option>{% endfor %}
  </select></td>
  <td><select name="r{{ r.i }}_qualifica" aria-label="Qualifica richiesta">
    <option value="">—</option>
    {% for q in qualifiche_opts %}<option value="{{ q.pk }}"{% if q.pk == r.qualifica_id %} selected{% endif %}>{{ q.nome }}</option>{% endfor %}
  </select></td>
  <td><select name="r{{ r.i }}_processo" aria-label="Abilitazione MOD.128 richiesta">
    <option value="">—</option>
    {% for p in processi_opts %}<option value="{{ p.id }}"{% if p.id == r.processo_id %} selected{% endif %}>{{ p.nome|truncatechars:50 }}</option>{% endfor %}
  </select></td>
  <td><input type="number" name="r{{ r.i }}_ordine" value="{{ r.ordine }}" min="0" max="999" class="mst-ord" aria-label="Ordine"></td>
  <td class="mst-c">{% if r.id %}<input type="checkbox" name="r{{ r.i }}_togli"{% if r.togli %} checked{% endif %} aria-label="Togli la competenza">{% endif %}</td>
</tr>
