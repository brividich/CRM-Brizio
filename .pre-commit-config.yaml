# Hook locali (igiene repo, 18/10/2026). Installazione una tantum:
#   pip install -r django_app/requirements-dev.txt
#   pre-commit install
# Configurazione ruff in pyproject.toml. Gli hook girano solo sui file in staging.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7  # allineato a ruff==0.16.7 in django_app/requirements-dev.txt
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=5120]
